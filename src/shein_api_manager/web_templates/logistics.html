<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHEIN 物流分析</title>

<style>#syncLatest{background:#fff;color:var(--accent);border:1px solid var(--accent)}.actions button:disabled{opacity:.62;cursor:wait}</style>
<style>:root{--bg:#eef3f2;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d6dee4;--accent:#0f766e;--blue:#2563eb;--warn:#b45309;--bad:#b42318;--good:#087443;--purple:#6d28d9;--soft:#f8fafb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}.shell{max-width:1640px;margin:0 auto;padding:18px 20px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.brand h1{font-size:25px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a.active{color:var(--accent);font-weight:800}.filters{display:grid;grid-template-columns:minmax(360px,1.4fr) 210px 210px auto;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:750;color:#344054;margin-bottom:6px}.field select,.field input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:#fff;color:var(--ink)}.field select[multiple]{height:118px;padding:8px}.actions button{height:40px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;padding:0 18px;cursor:pointer}.hint,.status{font-size:12px;color:var(--muted);line-height:1.45}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 14px;min-height:86px}.card .k{font-size:12px;color:var(--muted);font-weight:700}.card .v{font-size:23px;font-weight:850;margin-top:8px;letter-spacing:0}.card .s{font-size:12px;color:var(--muted);margin-top:4px}.card.good .v{color:var(--good)}.card.bad .v{color:var(--bad)}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px}.grid.three{grid-template-columns:1fr 1fr 1fr}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.panel h2{margin:0;font-size:15px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tools input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;min-width:300px}.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}.seg button{height:32px;border:0;border-right:1px solid var(--line);background:#fff;padding:0 10px;color:var(--muted);font-weight:750;cursor:pointer}.seg button:last-child{border-right:0}.seg button.active{background:#e7f3f1;color:var(--accent)}.chart{width:100%;height:350px}.chart.small{height:320px}.table-wrap{overflow:auto;max-height:680px;border:1px solid var(--line);border-radius:8px;background:#fff}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:right;vertical-align:middle}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#f8fafb;color:#344054;z-index:1;cursor:pointer}.sku{font-weight:850;color:#17202a}.sub{display:block;margin-top:3px;color:var(--muted);font-size:12px;white-space:normal;max-width:360px;text-align:left}.badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;background:#e7f3f1;color:#0f766e;font-weight:800}.badge.warn{background:#fff1e7;color:#b45309}.badge.bad{background:#fee4e2;color:#b42318}.empty{padding:44px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:#fff}td.neg{color:var(--bad);font-weight:750}td.pos{color:var(--good);font-weight:750}@media(max-width:1240px){.cards{grid-template-columns:repeat(3,1fr)}.grid,.grid.three{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}}@media(max-width:720px){.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.shell{padding:14px 12px 28px}.field select[multiple]{height:150px}.tools input{min-width:0;width:100%}.chart{height:310px}.top,.panel-head{align-items:flex-start;flex-direction:column}}</style>
</head><body><div class="shell"><div class="top"><div class="brand"><h1>SHEIN 物流分析</h1><p id="shop">加载中...</p></div><div class="nav"><a href="./">PNL</a><a class="active" href="logistics">物流分析</a><a href="shipping-fee">Shipping Fee</a><a href="returns">退货明细</a><a href="sku-mappings">SKU映射</a><a href="warehouse-relations">关联视图</a><a href="inventory">库存管理</a><a href="inventory-templates">成本模板</a><a href="logout">退出</a></div></div><div class="filters"><div class="field"><label>SHEIN SKU Code / 规格（可多选）</label><select id="sku" multiple></select><div class="hint">不选表示全部 SKU。</div></div><div class="field"><label>开始时间</label><input id="start" type="datetime-local"></div><div class="field"><label>结束时间</label><input id="end" type="datetime-local"></div><div class="actions"><button id="apply">刷新数据</button><button id="syncLatest" type="button">抓取最新数据</button><div class="hint" id="rangeHint"></div></div></div><div class="cards" id="cards"></div><div class="grid"><div class="panel"><div class="panel-head"><h2>履约费趋势</h2><span class="status" id="trendStatus"></span></div><div id="trendChart" class="chart"></div></div><div class="panel"><div class="panel-head"><h2>费用分布</h2><span class="status" id="distStatus"></span></div><div id="distChart" class="chart"></div></div></div><div class="grid three"><div class="panel"><div class="panel-head"><h2>SKU 履约费排行</h2><div class="seg" id="rankMode"><button data-mode="avgFulfillmentFee" class="active">均费</button><button data-mode="fulfillmentFee">总费</button><button data-mode="feeRate">费率</button></div></div><div id="rankChart" class="chart small"></div></div><div class="panel"><div class="panel-head"><h2>SKU 费用散点</h2><span class="status">点大小代表总履约费</span></div><div id="scatterChart" class="chart small"></div></div><div class="panel"><div class="panel-head"><h2>订单状态口径</h2><span class="status" id="statusNote"></span></div><div id="statusChart" class="chart small"></div></div></div><div class="panel"><div class="panel-head"><h2>SKU 物流明细</h2><div class="tools"><input id="search" placeholder="搜索 SKU code / 规格"><span class="status" id="tableStatus"></span></div></div><div class="table-wrap"><table id="skuTable"></table></div></div></div>
<script>
const fmtMoney=v=>'$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const fmtNum=v=>Number(v||0).toLocaleString();const fmtPct=v=>(v===null||v===undefined||isNaN(v))?'-':(Number(v)*100).toFixed(2)+'%';const val=id=>document.getElementById(id).value;const selected=id=>Array.from(document.getElementById(id).selectedOptions).map(o=>o.value);const escapeHtml=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const cell=(v,cls='')=>`<td class="${cls}">${v??''}</td>`;let state={skuTable:[],daily:[],statusMix:[],feeBuckets:[],summary:{},sort:['fulfillmentFee',-1],rankMode:'avgFulfillmentFee'};const charts={trend:null,dist:null,rank:null,scatter:null,status:null};const chartIds={trend:'trendChart',dist:'distChart',rank:'rankChart',scatter:'scatterChart',status:'statusChart'};function chart(id){if(!charts[id])charts[id]=echarts.init(document.getElementById(chartIds[id]));return charts[id]}
async function init(){const f=await fetch('api/logistics/filters');if(!f.ok){location.reload();return}const data=await f.json();document.getElementById('shop').textContent=data.shop+' · /shein/shein-us';document.getElementById('sku').innerHTML=(data.skus||[]).map(s=>`<option value="${escapeHtml(s.key)}">${escapeHtml(s.code||'-')} · ${escapeHtml(s.label)} · ${fmtNum(s.lines)}行 · ${fmtMoney(s.fulfillmentFee)}</option>`).join('');document.getElementById('start').value=data.minTime;document.getElementById('end').value=data.maxTime;document.getElementById('rangeHint').textContent=`${data.minTime} 至 ${data.maxTime}`;document.getElementById('apply').onclick=loadData;document.getElementById('syncLatest').onclick=syncLatest;document.getElementById('search').oninput=()=>renderTable(state.skuTable);document.querySelectorAll('#rankMode button').forEach(btn=>btn.onclick=()=>{state.rankMode=btn.dataset.mode;document.querySelectorAll('#rankMode button').forEach(b=>b.classList.toggle('active',b===btn));renderRank()});await loadData()}
async function loadData(){const qs=new URLSearchParams();selected('sku').forEach(s=>qs.append('sku',s));if(val('start'))qs.set('start',val('start'));if(val('end'))qs.set('end',val('end'));const r=await fetch('api/logistics/data?'+qs.toString());if(!r.ok){alert('加载失败：'+await r.text());return}const data=await r.json();state={...state,summary:data.summary||{},skuTable:data.skuTable||[],daily:data.daily||[],statusMix:data.statusMix||[],feeBuckets:data.feeBuckets||[]};renderCards();renderCharts();renderTable(state.skuTable)}
async function syncLatest(){const btn=document.getElementById('syncLatest'),apply=document.getElementById('apply'),old=btn.textContent;btn.disabled=true;apply.disabled=true;btn.textContent='抓取中...';document.getElementById('rangeHint').textContent='正在抓取最新订单并重建利润数据...';try{const r=await fetch('api/logistics/sync-latest',{method:'POST'});if(!r.ok)throw new Error(await r.text());const data=await r.json(),orders=data.sync?.orders||{},exported=data.export||{};document.getElementById('rangeHint').textContent=`抓取完成：订单 ${fmtNum(orders.ordersSeen||0)} 单，利润表 ${fmtNum(exported.item_rows||0)} 行，正在刷新页面...`;setTimeout(()=>location.reload(),500)}catch(err){alert('抓取履约最新数据失败：'+err.message);document.getElementById('rangeHint').textContent='抓取失败';btn.disabled=false;apply.disabled=false;btn.textContent=old}}
function renderCards(){const s=state.summary;const cards=[['有效 SKU',fmtNum(s.skuCount),`${fmtNum(s.effectiveLines)} 有效行 / ${fmtNum(s.effectiveOrders)} 单`],['履约费',fmtMoney(s.fulfillmentFee),`平均每行 ${fmtMoney(s.avgFeePerLine)}`],['单均履约费',fmtMoney(s.avgFeePerOrder),`按有效订单计算`],['履约费率',fmtPct(s.feeRate),`原始收入 ${fmtMoney(s.grossRevenue)}`],['售后有效行',fmtNum(s.afterSalesLines),`${fmtNum(s.afterSalesOrders)} 单，保留在口径内`],['已剔除行',fmtNum(s.excludedLines),`${fmtNum(s.excludedOrders)} 单未产生履约费`,s.excludedLines?'bad':'good']];document.getElementById('cards').innerHTML=cards.map(c=>`<div class="card ${c[3]||''}"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${c[2]}</div></div>`).join('')}
function renderCharts(){renderTrend();renderDistribution();renderRank();renderScatter();renderStatus()}
function renderTrend(){const rows=state.daily;document.getElementById('trendStatus').textContent=`${fmtNum(rows.length)} 天`;chart('trend').setOption({color:['#0f766e','#2563eb','#b45309'],tooltip:{trigger:'axis',axisPointer:{type:'cross'},formatter:ps=>ps.map(p=>`${p.marker}${p.seriesName}: ${p.seriesName==='有效行'?fmtNum(p.value):fmtMoney(p.value)}`).join('<br>')},legend:{top:0},grid:{left:58,right:58,top:42,bottom:58},toolbox:{right:8,feature:{saveAsImage:{}}},dataZoom:[{type:'inside'},{type:'slider',height:22,bottom:10}],xAxis:{type:'category',data:rows.map(r=>String(r.day).slice(5,10)),axisLabel:{color:'#667085'}},yAxis:[{type:'value',name:'金额',axisLabel:{formatter:v=>'$'+v}},{type:'value',name:'行数',axisLabel:{formatter:v=>fmtNum(v)}}],series:[{name:'总履约费',type:'bar',barMaxWidth:22,data:rows.map(r=>Number(r.fulfillmentFee||0))},{name:'平均每行',type:'line',smooth:true,showSymbol:false,data:rows.map(r=>Number(r.avgFee||0)),markLine:{symbol:'none',lineStyle:{type:'dashed',color:'#667085'},data:[{type:'average',name:'均值'}]}},{name:'有效行',type:'line',smooth:true,showSymbol:false,yAxisIndex:1,data:rows.map(r=>Number(r.lines||0))}]})}
function renderDistribution(){const rows=state.feeBuckets;document.getElementById('distStatus').textContent=`${fmtNum(state.summary.effectiveLines||0)} 行`;chart('dist').setOption({color:['#2563eb'],tooltip:{trigger:'axis',axisPointer:{type:'shadow'},valueFormatter:fmtNum},grid:{left:46,right:22,top:26,bottom:46},toolbox:{right:8,feature:{saveAsImage:{}}},xAxis:{type:'category',data:rows.map(r=>r.label),axisLabel:{color:'#667085'}},yAxis:{type:'value',axisLabel:{formatter:v=>fmtNum(v)}},series:[{name:'商品行',type:'bar',barMaxWidth:34,data:rows.map(r=>Number(r.lines||0)),itemStyle:{borderRadius:[4,4,0,0]}}]})}
function metricValue(r,key){return Number(r[key]||0)}function metricLabel(key){return key==='fulfillmentFee'?'总履约费':key==='feeRate'?'履约费率':'平均每行'}function metricFormat(key,v){return key==='feeRate'?fmtPct(v):fmtMoney(v)}function topRows(key){return [...state.skuTable].filter(r=>Number(r.lines||0)>0).sort((a,b)=>metricValue(b,key)-metricValue(a,key)).slice(0,14).reverse()}
function renderRank(){const key=state.rankMode;const rows=topRows(key);chart('rank').setOption({color:[key==='feeRate'?'#6d28d9':key==='fulfillmentFee'?'#0f766e':'#2563eb'],tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:ps=>{const p=ps[0],r=rows[p.dataIndex];return `${escapeHtml(r.logistics_sku_code||'-')}<br>${escapeHtml(r.logistics_sku_label||'未匹配')}<br>${metricLabel(key)} ${metricFormat(key,p.value)}<br>有效行 ${fmtNum(r.lines)} · 总费 ${fmtMoney(r.fulfillmentFee)}`}},grid:{left:126,right:26,top:16,bottom:30},xAxis:{type:'value',axisLabel:{formatter:v=>key==='feeRate'?(Number(v)*100).toFixed(0)+'%':'$'+v}},yAxis:{type:'category',data:rows.map(r=>String(r.logistics_sku_label||r.logistics_sku_code).slice(0,24)),axisLabel:{color:'#667085'}},series:[{name:metricLabel(key),type:'bar',barMaxWidth:20,data:rows.map(r=>metricValue(r,key)),label:{show:true,position:'right',formatter:p=>metricFormat(key,p.value)}}]})}
function renderScatter(){const rows=state.skuTable;const maxFee=Math.max(1,...rows.map(r=>Number(r.fulfillmentFee||0)));chart('scatter').setOption({color:['#0f766e'],tooltip:{trigger:'item',formatter:p=>{const r=p.data.raw;return `${escapeHtml(r.logistics_sku_code||'-')}<br>${escapeHtml(r.logistics_sku_label||'未匹配')}<br>有效行 ${fmtNum(r.lines)}<br>平均每行 ${fmtMoney(r.avgFulfillmentFee)}<br>总履约费 ${fmtMoney(r.fulfillmentFee)}<br>费率 ${fmtPct(r.feeRate)}`}},grid:{left:54,right:22,top:22,bottom:46},xAxis:{name:'有效行',type:'value',axisLabel:{formatter:v=>fmtNum(v)}},yAxis:{name:'平均履约费',type:'value',axisLabel:{formatter:v=>'$'+v}},dataZoom:[{type:'inside'}],series:[{type:'scatter',data:rows.map(r=>({value:[Number(r.lines||0),Number(r.avgFulfillmentFee||0)],raw:r,symbolSize:Math.max(7,Math.min(30,7+Number(r.fulfillmentFee||0)/maxFee*26)),itemStyle:{color:Number(r.feeRate||0)>.2?'#b45309':'#0f766e',opacity:.82}}))}]})}
function renderStatus(){const rows=state.statusMix;document.getElementById('statusNote').textContent=`剔除待揽收/待发货/未确认`;chart('status').setOption({color:['#0f766e','#b42318','#b45309'],tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:ps=>ps.map(p=>`${p.marker}${p.seriesName}: ${fmtNum(p.value)}`).join('<br>')},legend:{top:0},grid:{left:82,right:20,top:42,bottom:34},xAxis:{type:'value',axisLabel:{formatter:v=>fmtNum(v)}},yAxis:{type:'category',data:rows.map(r=>r.statusLabel||r.order_status||'未知'),axisLabel:{color:'#667085'}},series:[{name:'有效行',type:'bar',stack:'lines',data:rows.map(r=>Number(r.effectiveLines||0))},{name:'剔除行',type:'bar',stack:'lines',data:rows.map(r=>Number(r.excludedLines||0))},{name:'售后行',type:'bar',data:rows.map(r=>Number(r.afterSalesLines||0))}]})}
const numericCols=new Set(['lines','orders','fulfillmentFee','avgFulfillmentFee','avgFeePerOrder','medianFulfillmentFee','p75FulfillmentFee','maxFulfillmentFee','feeShare','feeRate','afterSalesLines','zeroFeeLines','avgWeight']);function compareRows(a,b,key,dir){const av=a[key]??'',bv=b[key]??'';if(numericCols.has(key)){const an=Number(av)||0,bn=Number(bv)||0;return (an===bn?0:(an>bn?1:-1))*dir}return String(av).localeCompare(String(bv))*dir}function sortRows(rows,key){const cur=state.sort;const dir=cur[0]===key?-cur[1]:-1;state.sort=[key,dir];return [...rows].sort((a,b)=>compareRows(a,b,key,dir))}
function renderTable(rows){const q=document.getElementById('search').value.toLowerCase();let filtered=rows.filter(r=>(`${r.logistics_sku_code} ${r.logistics_sku_label}`).toLowerCase().includes(q));const [key,dir]=state.sort;filtered=[...filtered].sort((a,b)=>compareRows(a,b,key,dir));document.getElementById('tableStatus').textContent=`${filtered.length} 个 SKU / ${fmtNum(state.summary.effectiveLines||0)} 有效行`;if(!filtered.length){document.getElementById('skuTable').outerHTML='<table id="skuTable"><tr><td><div class="empty">暂无物流数据</div></td></tr></table>';return}const head='<tr><th data-k="logistics_sku_code">SHEIN SKU Code</th><th data-k="logistics_sku_label">规格</th><th data-k="lines">有效行</th><th data-k="orders">有效订单</th><th data-k="fulfillmentFee">履约费</th><th data-k="avgFulfillmentFee">平均每行</th><th data-k="avgFeePerOrder">平均每单</th><th data-k="medianFulfillmentFee">中位数</th><th data-k="p75FulfillmentFee">P75</th><th data-k="maxFulfillmentFee">最高单行</th><th data-k="feeShare">费用占比</th><th data-k="feeRate">费率</th><th data-k="afterSalesLines">售后行</th><th data-k="zeroFeeLines">0费用行</th><th data-k="avgWeight">平均重量</th></tr>';const body=filtered.map(r=>`<tr>${cell(`<span class="sku">${escapeHtml(r.logistics_sku_code||'-')}</span>`)}${cell(`<span class="sub">${escapeHtml(r.logistics_sku_label||'未匹配')}</span>`)}${cell(fmtNum(r.lines))}${cell(fmtNum(r.orders))}${cell(fmtMoney(r.fulfillmentFee))}${cell(fmtMoney(r.avgFulfillmentFee))}${cell(fmtMoney(r.avgFeePerOrder))}${cell(fmtMoney(r.medianFulfillmentFee))}${cell(fmtMoney(r.p75FulfillmentFee))}${cell(fmtMoney(r.maxFulfillmentFee))}${cell(fmtPct(r.feeShare))}${cell(fmtPct(r.feeRate))}${cell(r.afterSalesLines?`<span class="badge warn">${fmtNum(r.afterSalesLines)}</span>`:'0')}${cell(r.zeroFeeLines?`<span class="badge bad">${fmtNum(r.zeroFeeLines)}</span>`:'0')}${cell(Number(r.avgWeight||0).toFixed(3))}</tr>`).join('');const table=document.getElementById('skuTable');table.innerHTML=head+body;document.querySelectorAll('#skuTable th[data-k]').forEach(th=>th.onclick=()=>{state.skuTable=sortRows(state.skuTable,th.dataset.k);renderTable(state.skuTable)})}
state.dimension='platform_sku';
const logisticsFetch=window.fetch.bind(window);
window.fetch=(input,options)=>{
  if(typeof input==='string'&&input.includes('api/logistics/')){
    const url=new URL(input,location.href);
    url.searchParams.set('dimension',state.dimension);
    return logisticsFetch(url.toString(),options)
  }
  return logisticsFetch(input,options)
};
function logisticsDimensionLabel(){return state.dimension==='warehouse_sku'?'仓库 SKU':'平台 SKU'}
function updateLogisticsDimensionCopy(){
  const label=logisticsDimensionLabel(),warehouse=state.dimension==='warehouse_sku';
  const filterLabel=document.querySelector('.filters .field label');
  if(filterLabel)filterLabel.textContent=label+'（可多选）';
  document.getElementById('search').placeholder='搜索 '+label+(warehouse?'':' / 规格');
  document.querySelectorAll('.panel h2').forEach(h=>{
    if(h.textContent.includes('履约费排行'))h.textContent=label+' 履约费排行';
    if(h.textContent.includes('费用散点'))h.textContent=label+' 费用散点';
    if(h.textContent.includes('物流明细'))h.textContent=label+' 物流明细';
  });
  const cardKey=document.querySelector('#cards .card .k');
  if(cardKey)cardKey.textContent='有效 '+label;
  const headers=document.querySelectorAll('#skuTable th');
  if(headers[0])headers[0].textContent=label;
  if(headers[1])headers[1].textContent=warehouse?'平台 SKU 数':'规格';
  document.getElementById('tableStatus').textContent=`${state.skuTable.length} 个${label} / ${fmtNum(state.summary.effectiveLines||0)} 有效行`;
}
async function reloadLogisticsDimension(){
  const response=await fetch('api/logistics/filters');
  if(!response.ok){alert('维度切换失败：'+await response.text());return}
  const data=await response.json(),warehouse=state.dimension==='warehouse_sku';
  document.getElementById('sku').innerHTML=(data.skus||[]).map(s=>{
    const detail=warehouse?`${fmtNum(s.platformSkuCount)} 个平台 SKU`:s.label;
    return `<option value="${escapeHtml(s.key)}">${escapeHtml(s.code||'-')} · ${escapeHtml(detail)} · ${fmtNum(s.lines)}行 · ${fmtMoney(s.fulfillmentFee)}</option>`
  }).join('');
  await loadData();
  updateLogisticsDimensionCopy()
}
function installLogisticsDimensionControl(){
  const field=document.querySelector('.filters .field'),control=document.createElement('div');
  control.className='seg';control.id='skuDimension';control.style.marginBottom='10px';
  control.innerHTML='<button type="button" data-dimension="platform_sku" class="active">平台 SKU</button><button type="button" data-dimension="warehouse_sku">仓库 SKU</button>';
  field.insertBefore(control,field.firstChild);
  control.querySelectorAll('button').forEach(button=>button.onclick=async()=>{
    if(button.dataset.dimension===state.dimension)return;
    state.dimension=button.dataset.dimension;
    control.querySelectorAll('button').forEach(item=>item.classList.toggle('active',item===button));
    updateLogisticsDimensionCopy();
    await reloadLogisticsDimension()
  })
}
