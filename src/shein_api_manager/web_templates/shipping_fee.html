<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHEIN Shipping Fee 达成率</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--bg:#eef3f2;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d6dee4;--accent:#0f766e;--blue:#2563eb;--warn:#b45309;--bad:#b42318;--good:#087443;--purple:#6d28d9;--soft:#f8fafb;--focus:#d6f3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}.shell{max-width:1680px;margin:0 auto;padding:18px 20px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.brand h1{font-size:25px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a.active{color:var(--accent);font-weight:800}.filters{display:grid;grid-template-columns:150px 150px 180px 120px 170px 170px auto;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:750;color:#344054;margin-bottom:6px}.field select,.field input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:#fff;color:var(--ink);outline:0}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.actions{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}.btn{height:40px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:850;padding:0 18px;cursor:pointer}.btn:disabled{opacity:.62;cursor:wait}.hint,.status{font-size:12px;color:var(--muted);line-height:1.45}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 14px;min-height:88px}.card .k{font-size:12px;color:var(--muted);font-weight:750}.card .v{font-size:23px;font-weight:850;margin-top:8px;letter-spacing:0}.card .s{font-size:12px;color:var(--muted);margin-top:4px}.card.good .v{color:var(--good)}.card.bad .v{color:var(--bad)}.card.warn .v{color:var(--warn)}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.panel h2{margin:0;font-size:15px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.chart{width:100%;height:380px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tools input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;min-width:320px;background:#fff}.table-wrap{overflow:auto;max-height:680px;border:1px solid var(--line);border-radius:8px;background:#fff}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:right;vertical-align:middle}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#f8fafb;color:#344054;z-index:1;cursor:pointer}.code{font-weight:850;color:#17202a;overflow-wrap:anywhere}.sub{display:block;margin-top:3px;color:var(--muted);font-size:12px;white-space:normal;max-width:360px;text-align:left}.badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;background:#e7f3f1;color:#0f766e;font-weight:800}.empty{padding:44px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:#fff}.pos{color:var(--good);font-weight:850}.neg{color:var(--bad);font-weight:850}.zero{color:var(--muted);font-weight:750}@media(max-width:1320px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.filters{grid-template-columns:repeat(3,1fr)}.actions{grid-column:1/-1}}@media(max-width:760px){.shell{padding:14px 12px 28px}.top,.panel-head{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.tools input{min-width:0;width:100%}.chart{height:320px}.btn{width:100%}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="brand"><h1>Shipping Fee 达成率</h1><p id="shop">加载中...</p></div><div class="nav"><a href="./">PNL</a><a href="logistics">物流分析</a><a class="active" href="shipping-fee">Shipping Fee</a><a href="returns">退货明细</a><a href="sku-mappings">SKU映射</a><a href="warehouse-relations">关联视图</a><a href="inventory">库存管理</a><a href="logout">退出</a></div></div>
  <div class="filters">
    <div class="field"><label>Rolling 天数</label><input id="rolling" type="number" min="1" max="90" step="1"></div>
    <div class="field"><label>Shift 天数</label><input id="shift" type="number" min="1" max="90" step="1"></div>
    <div class="field"><label>拆分维度</label><select id="dimension"></select></div>
    <div class="field"><label>Top N</label><input id="topN" type="number" min="1" max="50" step="1"></div>
    <div class="field"><label>开始日期</label><input id="start" type="date"></div>
    <div class="field"><label>结束日期</label><input id="end" type="date"></div>
    <div class="actions"><button class="btn" id="apply" type="button">刷新数据</button><div class="hint" id="rangeHint"></div></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="grid">
    <div class="panel"><div class="panel-head"><h2>Rolling 达成率</h2><span class="status" id="rateStatus"></span></div><div id="rateChart" class="chart"></div></div>
    <div class="panel"><div class="panel-head"><h2>Shift 变化</h2><span class="status" id="changeStatus"></span></div><div id="changeChart" class="chart"></div></div>
  </div>
  <div class="panel"><div class="panel-head"><h2>维度明细</h2><div class="tools"><input id="search" placeholder="搜索维度"><span class="status" id="tableStatus"></span></div></div><div class="table-wrap"><table id="detailTable"></table></div></div>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const fmtNum=v=>Number(v||0).toLocaleString();const fmtMoney=v=>'$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const fmtPct=v=>(v===null||v===undefined||Number.isNaN(Number(v)))?'-':(Number(v)*100).toFixed(2)+'%';const fmtPp=v=>{if(v===null||v===undefined||Number.isNaN(Number(v)))return '-';const n=Number(v)*100;return `${n>0?'+':''}${n.toFixed(2)}pp`};const ppCls=v=>v===null||v===undefined||Number.isNaN(Number(v))?'zero':Number(v)>0?'pos':Number(v)<0?'neg':'zero';const val=id=>$(id).value;const dateText=v=>String(v||'').slice(0,10);const cell=(v,cls='')=>`<td class="${cls}">${v??''}</td>`;let state={summary:{},groups:[],series:[],table:[],sort:['currentLines',-1]};const charts={rate:null,change:null};function chart(name){if(!charts[name])charts[name]=echarts.init($(name+'Chart'));return charts[name]}
async function init(){const r=await fetch('api/shipping-fee/filters');if(!r.ok){location.reload();return}const data=await r.json();$('shop').textContent=`${data.shop} · ${fmtNum(data.summary?.hitLines||0)} / ${fmtNum(data.summary?.lines||0)} 行`;const d=data.defaults||{};$('rolling').value=d.rollingDays||7;$('shift').value=d.shiftDays||7;$('topN').value=d.topN||12;$('dimension').innerHTML=(data.dimensions||[]).map(item=>`<option value="${esc(item.value)}">${esc(item.label)}</option>`).join('');$('dimension').value=d.dimension||'warehouse_sku';$('start').value=dateText(data.minTime);$('end').value=dateText(data.maxTime);$('rangeHint').textContent=`${dateText(data.minTime)} 至 ${dateText(data.maxTime)}`;$('apply').onclick=loadData;$('search').oninput=renderTable;await loadData()}
async function loadData(){const qs=new URLSearchParams();if(val('start'))qs.set('start',val('start'));if(val('end'))qs.set('end',val('end'));qs.set('rolling',val('rolling')||7);qs.set('shift',val('shift')||7);qs.set('dimension',val('dimension')||'warehouse_sku');qs.set('topN',val('topN')||12);const btn=$('apply');btn.disabled=true;try{const r=await fetch('api/shipping-fee/data?'+qs.toString());if(!r.ok){alert('加载失败：'+await r.text());return}const data=await r.json();state={...state,summary:data.summary||{},groups:data.groups||[],series:data.series||[],table:data.table||[]};renderCards();renderCharts();renderTable()}finally{btn.disabled=false}}
function renderCards(){const s=state.summary||{};const cards=[['当前达成率',fmtPct(s.currentRate),`${s.currentWindowStart||''} 至 ${s.currentWindowEnd||''}`,s.changePp>0?'good':s.changePp<0?'bad':''],['Shift 对照',fmtPct(s.shiftedRate),`${s.shiftedWindowStart||''} 至 ${s.shiftedWindowEnd||''}`],['变化',fmtPp(s.changePp),`${fmtNum(s.currentHitLines)} / ${fmtNum(s.currentLines)} 行`,s.changePp>0?'good':s.changePp<0?'bad':''],['当前窗口行',fmtNum(s.currentLines),`${fmtNum(s.currentOrders)} 单 · ${fmtMoney(s.currentShippingRevenue)}`],['区间达成率',fmtPct(s.periodRate),`${fmtNum(s.periodHitLines)} / ${fmtNum(s.periodLines)} 行`],['拆分组数',fmtNum(s.groupCount),`${(state.groups||[]).length} 组展示 · ${s.rollingDays}D rolling / ${s.shiftDays}D shift`]];$('cards').innerHTML=cards.map(c=>`<div class="card ${c[3]||''}"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${c[2]}</div></div>`).join('')}
function groupRows(){const out=new Map();for(const g of state.groups||[])out.set(g.key,{key:g.key,label:g.label});for(const r of state.series||[])if(!out.has(r.groupKey))out.set(r.groupKey,{key:r.groupKey,label:r.groupLabel});return [...out.values()]}
function dateRows(){return [...new Set((state.series||[]).map(r=>dateText(r.day)))].sort()}
function dataMap(){const m=new Map();for(const r of state.series||[])m.set(`${r.groupKey}|${dateText(r.day)}`,r);return m}
function renderCharts(){renderRateChart();renderChangeChart()}
function renderRateChart(){const rows=state.series||[],groups=groupRows(),dates=dateRows(),m=dataMap();$('rateStatus').textContent=`${fmtNum(dates.length)} 天 · ${fmtNum(groups.length)} 组`;const series=groups.map(g=>({name:g.label,type:'line',smooth:true,showSymbol:false,connectNulls:false,data:dates.map(d=>m.get(`${g.key}|${d}`)?.rate??null)}));if(groups.length===1){const g=groups[0];series.push({name:'Shift 对照',type:'line',smooth:true,showSymbol:false,lineStyle:{type:'dashed'},data:dates.map(d=>m.get(`${g.key}|${d}`)?.shiftedRate??null)})}chart('rate').setOption({color:['#0f766e','#2563eb','#b45309','#6d28d9','#087443','#b42318','#475467','#0e7490'],tooltip:{trigger:'axis',valueFormatter:fmtPct},legend:{type:'scroll',top:0},grid:{left:54,right:28,top:46,bottom:58},toolbox:{right:8,feature:{saveAsImage:{}}},dataZoom:[{type:'inside'},{type:'slider',height:22,bottom:10}],xAxis:{type:'category',data:dates,axisLabel:{color:'#667085'}},yAxis:{type:'value',min:0,max:1,axisLabel:{formatter:v=>(Number(v)*100).toFixed(0)+'%'}},series})}
function renderChangeChart(){const groups=groupRows(),dates=dateRows(),m=dataMap();$('changeStatus').textContent=`相对前 ${state.summary?.shiftDays||0} 天窗口`;const asBar=groups.length===1;const series=groups.map(g=>({name:g.label,type:asBar?'bar':'line',barMaxWidth:24,smooth:true,showSymbol:false,data:dates.map(d=>m.get(`${g.key}|${d}`)?.changePp??null)}));chart('change').setOption({color:['#2563eb','#0f766e','#b45309','#6d28d9','#087443','#b42318','#475467','#0e7490'],tooltip:{trigger:'axis',valueFormatter:fmtPp},legend:{type:'scroll',top:0},grid:{left:58,right:28,top:46,bottom:58},toolbox:{right:8,feature:{saveAsImage:{}}},dataZoom:[{type:'inside'},{type:'slider',height:22,bottom:10}],xAxis:{type:'category',data:dates,axisLabel:{color:'#667085'}},yAxis:{type:'value',axisLabel:{formatter:v=>(Number(v)*100).toFixed(0)+'pp'},splitLine:{lineStyle:{type:'dashed'}}},series})}
const numCols=new Set(['currentRate','shiftedRate','changePp','currentLines','currentHitLines','shiftedLines','shiftedHitLines','periodRate','periodLines','periodHitLines','periodOrders','periodShippingRevenue']);function cmp(a,b,key,dir){if(numCols.has(key)){const av=Number(a[key]??-Infinity),bv=Number(b[key]??-Infinity);return (av===bv?0:av>bv?1:-1)*dir}return String(a[key]??'').localeCompare(String(b[key]??''))*dir}function sortBy(key){const cur=state.sort;state.sort=cur[0]===key?[key,-cur[1]]:[key,-1];renderTable()}
function renderTable(){const q=$('search').value.trim().toLowerCase();let rows=(state.table||[]).filter(r=>`${r.groupLabel} ${r.groupKey}`.toLowerCase().includes(q));const [key,dir]=state.sort;rows=[...rows].sort((a,b)=>cmp(a,b,key,dir));$('tableStatus').textContent=`${rows.length} 组`;if(!rows.length){$('detailTable').innerHTML='<tr><td><div class="empty">暂无 shipping fee 达成率数据</div></td></tr>';return}const head='<tr><th data-k="groupLabel">维度</th><th data-k="currentRate">当前达成率</th><th data-k="shiftedRate">Shift 达成率</th><th data-k="changePp">变化</th><th data-k="currentLines">当前命中/行</th><th data-k="shiftedLines">Shift 命中/行</th><th data-k="periodRate">区间达成率</th><th data-k="periodLines">区间命中/行</th><th data-k="periodOrders">订单</th><th data-k="periodShippingRevenue">Shipping Fee</th></tr>';const body=rows.map(r=>`<tr>${cell(`<span class="code">${esc(r.groupLabel||'-')}</span><span class="sub">${esc(r.groupKey||'')}</span>`)}${cell(fmtPct(r.currentRate))}${cell(fmtPct(r.shiftedRate))}${cell(fmtPp(r.changePp),ppCls(r.changePp))}${cell(`${fmtNum(r.currentHitLines)} / ${fmtNum(r.currentLines)}`)}${cell(`${fmtNum(r.shiftedHitLines)} / ${fmtNum(r.shiftedLines)}`)}${cell(fmtPct(r.periodRate))}${cell(`${fmtNum(r.periodHitLines)} / ${fmtNum(r.periodLines)}`)}${cell(fmtNum(r.periodOrders))}${cell(fmtMoney(r.periodShippingRevenue))}</tr>`).join('');$('detailTable').innerHTML=head+body;document.querySelectorAll('#detailTable th[data-k]').forEach(th=>th.onclick=()=>sortBy(th.dataset.k))}
window.addEventListener('resize',()=>Object.values(charts).forEach(c=>c&&c.resize()));init();
</script>
</body>
</html>
