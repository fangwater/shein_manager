<style>:root{--bg:#f3f6f8;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d6dee4;--soft:#f8fafb;--accent:#0f766e;--blue:#2563eb;--warn:#b45309;--bad:#b42318;--good:#087443;--purple:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}.shell{max-width:1720px;margin:0 auto;padding:18px 20px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.brand h1{font-size:25px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a.active{color:var(--accent);font-weight:800}.cards{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 14px;min-height:88px}.card .k{font-size:12px;color:var(--muted);font-weight:750}.card .v{font-size:23px;font-weight:850;margin-top:8px;letter-spacing:0}.card .s{font-size:12px;color:var(--muted);margin-top:4px}.card.good .v{color:var(--good)}.card.warn .v{color:var(--warn)}.card.bad .v{color:var(--bad)}.toolbar{display:grid;grid-template-columns:minmax(260px,1.2fr) 180px 180px 220px auto;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:750;color:#344054;margin-bottom:6px}.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:#fff;color:var(--ink);outline:0}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #d6f3ee}.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}.seg button{height:40px;border:0;border-right:1px solid var(--line);background:#fff;padding:0 12px;color:var(--muted);font-weight:750;cursor:pointer;white-space:nowrap}.seg button:last-child{border-right:0}.seg button.active{background:#e7f3f1;color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:14px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.panel h2{font-size:15px;margin:0}.status,.hint{font-size:12px;color:var(--muted);line-height:1.45}.table-wrap{overflow:auto;max-height:760px;border:1px solid var(--line);border-radius:8px;background:#fff}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#f8fafb;color:#344054;z-index:1;cursor:pointer}tr{cursor:pointer}tr:hover td{background:#fbfdfd}.code{font-weight:850;color:#17202a}.sub{display:block;margin-top:3px;color:var(--muted);font-size:12px;white-space:normal;max-width:420px}.num{text-align:right}.badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;background:#e7f3f1;color:#0f766e;font-weight:800}.badge.blue{background:#e8f0ff;color:#2563eb}.badge.warn{background:#fff1e7;color:#b45309}.badge.bad{background:#fee4e2;color:#b42318}.badge.purple{background:#f1e9ff;color:#6d28d9}.thumb{width:52px;height:68px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#f3f4f6}.detail{position:sticky;top:14px}.hero{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}.hero img{width:118px;height:148px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:#f3f4f6}.hero-title{font-size:14px;font-weight:850;line-height:1.45;margin:0 0 8px}.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px 10px;font-size:12px;margin-top:10px}.kv div:nth-child(odd){color:var(--muted)}.kv div:nth-child(even){font-weight:750;min-width:0;overflow-wrap:anywhere}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{display:inline-flex;align-items:center;min-height:24px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:#fff;font-size:12px;color:#344054}.section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.section h3{font-size:13px;margin:0 0 8px}.mini-table{border:1px solid var(--line);border-radius:8px;overflow:hidden}.mini-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px;border-bottom:1px solid #edf0f4;font-size:12px}.mini-row:last-child{border-bottom:0}.mini-row span:first-child{color:#344054}.mini-row span:last-child{font-weight:800}.bar{height:7px;background:#edf0f4;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:99px}.empty{padding:48px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:#fff}.side-empty{padding:34px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:#fff}.nowrap{white-space:nowrap}.status-stack{display:grid;gap:6px;align-items:start}.map-btn{height:28px;border:1px solid var(--accent);border-radius:6px;background:#fff;color:var(--accent);font-size:12px;font-weight:850;padding:0 9px;cursor:pointer;white-space:nowrap}.map-btn:hover{background:#effaf8}.sku-compact{min-width:170px;max-width:245px}.sku-meta{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.35;white-space:normal;max-width:245px}.product-mini{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;max-width:310px}.product-mini .thumb{width:42px;height:54px}.product-copy{min-width:0}.product-title{display:block;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#344054;font-size:12px;font-weight:750}.product-copy .sub{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.34);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop[hidden]{display:none}.modal{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 24px 80px rgba(16,24,40,.28);padding:16px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.modal-head h2{font-size:16px;margin:0}.close-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#344054;font-weight:850;cursor:pointer}.readonly{min-height:38px;border:1px solid var(--line);border-radius:6px;background:#f8fafb;padding:9px 10px;font-size:12px;overflow-wrap:anywhere}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.primary-btn,.secondary-btn{height:38px;border-radius:6px;font-weight:850;padding:0 13px;cursor:pointer}.primary-btn{border:0;background:var(--accent);color:#fff}.primary-btn:disabled{opacity:.65;cursor:wait}.secondary-btn{border:1px solid var(--line);background:#fff;color:#344054}.toast{position:fixed;right:18px;bottom:18px;max-width:420px;background:#17202a;color:#fff;border-radius:8px;padding:12px 14px;font-size:13px;box-shadow:0 10px 30px rgba(16,24,40,.18);display:none;z-index:30}.toast.show{display:block}.toast.bad{background:#8f1d17}@media(max-width:1280px){.cards{grid-template-columns:repeat(4,1fr)}.toolbar{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.detail{position:static}}@media(max-width:760px){.shell{padding:14px 12px 28px}.cards{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.top,.panel-head{align-items:flex-start;flex-direction:column}.seg{width:100%;overflow:auto}.seg button{flex:1}.hero{flex-direction:column}.hero img{width:100%;height:220px}.kv{grid-template-columns:1fr}.modal-actions{flex-direction:column}.primary-btn,.secondary-btn{width:100%}}</style>
</head><body><div class="shell"><div class="top"><div class="brand"><h1>SHEIN 仓库关联视图</h1><p id="shop">加载中...</p></div><div class="nav"><a href="./">PNL</a><a href="logistics">物流分析</a><a href="logistics-costs">物流费用</a><a href="shipping-fee">Shipping Fee</a><a href="returns">退货明细</a><a href="sku-mappings">SKU映射</a><a class="active" href="warehouse-relations">关联视图</a><a href="inventory">库存管理</a><a href="inventory-templates">成本模板</a><a href="logout">退出</a></div></div><div class="cards" id="cards"></div><div class="toolbar"><div class="field"><label>搜索</label><input id="search" placeholder="仓库 SKU / SHEIN SKU / SKC / SPU / 标题"></div><div class="field"><label>SKU 映射状态</label><select id="statusFilter"><option value="all">全部状态</option><option value="mapped">SKU已映射</option><option value="default">缺SKU映射（默认仓库）</option><option value="unmapped">缺SKU映射</option><option value="missing_product">缺商品资料</option></select></div><div class="field"><label>上架状态</label><select id="shelfFilter"><option value="all">全部</option><option value="1">上架</option><option value="0">下架</option><option value="unknown">未知</option></select></div><div class="field"><label>仓库 SKU</label><select id="warehouseFilter"><option value="all">全部仓库 SKU</option></select></div><div class="field"><label>维度</label><div class="seg" id="viewMode"><button data-view="sku" class="active">SKU</button><button data-view="warehouse">仓库</button><button data-view="spu">SPU</button><button data-view="skc">SKC</button><button data-view="unmapped">缺SKU映射</button></div></div></div><div class="layout"><div class="panel"><div class="panel-head"><h2 id="tableTitle">SKU 明细</h2><span class="status" id="tableStatus"></span></div><div class="table-wrap"><table id="mainTable"></table></div></div><aside class="panel detail"><div class="panel-head"><h2>详情</h2><span class="status" id="detailStatus"></span></div><div id="detailSlot" class="side-empty">选择一行查看商品、价格和库存</div></aside></div></div><div class="modal-backdrop" id="mappingModal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mappingModalTitle"><div class="modal-head"><h2 id="mappingModalTitle">补 SKU 映射</h2><button class="close-btn" id="closeMappingModal" type="button" title="关闭">×</button></div><form id="mappingModalForm"><div class="field"><label>SHEIN SKU</label><div class="readonly"><span class="code" id="mappingSheinSku"></span><span class="sku-meta" id="mappingSheinMeta"></span></div></div><div class="field"><label>仓库 SKU</label><select id="mappingWarehouseSku" required><option value="">选择仓库 SKU</option></select></div><div class="modal-actions"><button class="secondary-btn" id="cancelMappingModal" type="button">取消</button><button class="primary-btn" id="saveMappingModal" type="submit">保存映射</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const num=v=>Number(v||0).toLocaleString();const money=v=>v===null||v===undefined||v===''?'-':'$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const pct=v=>v===null||v===undefined?'-':(Number(v)*100).toFixed(1)+'%';const cell=(v,cls='')=>`<td class="${cls}">${v??''}</td>`;let state={rows:[],groups:{warehouses:[],spus:[],skcs:[]},summary:{},warehouseSkus:[],view:'sku',sort:['skuCode',1],selected:null,mappingTarget:null};
function badge(status){const map={mapped:['SKU已映射',''],default:['缺SKU映射·默认仓库','warn'],unmapped:['缺SKU映射','bad'],missing_product:['缺商品资料','purple']};const item=map[status]||[status,''];return `<span class="badge ${item[1]}">${item[0]}</span>`}function skuMappingHint(r){if(r.mappingStatus==='default')return '缺SKU映射，使用默认仓库';if(r.mappingStatus==='unmapped')return '缺SKU映射';if(r.mappingStatus==='missing_product')return 'SKU映射存在，但缺商品资料';return ''}function missingSkuMappingCount(g){return Number(g.missingSkuMappingCount??(Number(g.defaultCount||0)+Number(g.unmappedCount||0)))}function shelf(v){if(v===1)return '<span class="badge">上架</span>';if(v===0)return '<span class="badge warn">下架</span>';return '<span class="badge blue">未知</span>'}function titleOf(r){return r.title||r.attributeSummary||r.skuCode||r.key||''}function compare(a,b,key,dir){const av=a[key]??'',bv=b[key]??'';if(typeof av==='number'||typeof bv==='number')return (Number(av)>Number(bv)?1:Number(av)<Number(bv)?-1:0)*dir;return String(av).localeCompare(String(bv))*dir}function sorted(rows){const [key,dir]=state.sort;return [...rows].sort((a,b)=>compare(a,b,key,dir))}function setSort(key,dir=1){state.sort=[key,state.sort[0]===key?-state.sort[1]:dir];render()}
function toast(msg,bad=false){const el=$('toast');el.textContent=msg;el.className='toast show'+(bad?' bad':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.className='toast',3000)}
function warehouseOptions(selected=''){const seen=new Set();let options=state.warehouseSkus.filter(w=>w.warehouseSku).map(w=>{seen.add(w.warehouseSku);return `<option value="${esc(w.warehouseSku)}">${esc(w.warehouseSku)}</option>`});if(selected&&!seen.has(selected))options.unshift(`<option value="${esc(selected)}">${esc(selected)}</option>`);return '<option value="">选择仓库 SKU</option>'+options.join('')}
function canMap(r){return r&&['default','unmapped'].includes(r.mappingStatus)}
function compactMeta(parts){return parts.filter(Boolean).join(' · ')}
function sheinSkuMeta(r){return compactMeta([r.skcName?`SKC ${r.skcName}`:'',r.spuName?`SPU ${r.spuName}`:'',r.supplierSku?`商家SKU ${r.supplierSku}`:''])}
function statusCell(r){const rowIndex=state.rows.indexOf(r);return `<div class="status-stack">${badge(r.mappingStatus)}${canMap(r)?`<button class="map-btn" type="button" data-map-row="${rowIndex}">选择仓库</button>`:''}</div>`}
function sheinSkuCell(r){const meta=sheinSkuMeta(r);return `<div class="sku-compact"><span class="code">${esc(r.skuCode||'-')}</span>${meta?`<span class="sku-meta">${esc(meta)}</span>`:''}</div>`}
function productCell(r){const title=titleOf(r);const attr=r.attributeSummary&&r.attributeSummary!==title?r.attributeSummary:'';return `<div class="product-mini">${r.imageUrl?`<img class="thumb" src="${esc(r.imageUrl)}" loading="lazy">`:''}<div class="product-copy"><span class="product-title" title="${esc(title)}">${esc(title||'-')}</span>${attr?`<span class="sub" title="${esc(attr)}">${esc(attr)}</span>`:''}</div></div>`}
function openMappingModal(rowIndex){const r=state.rows[rowIndex];if(!canMap(r))return;state.mappingTarget=r;$('mappingSheinSku').textContent=r.skuCode||'';$('mappingSheinMeta').textContent=compactMeta([r.skcName?`SKC ${r.skcName}`:'',r.spuName?`SPU ${r.spuName}`:'',r.title||r.attributeSummary||'']);const selected=r.mappingStatus==='default'?(r.effectiveWarehouseSku||''):(r.warehouseSku||'');$('mappingWarehouseSku').innerHTML=warehouseOptions(selected);$('mappingWarehouseSku').value=selected;$('mappingModal').hidden=false;setTimeout(()=>$('mappingWarehouseSku').focus(),0)}
function closeMappingModal(){state.mappingTarget=null;$('mappingModal').hidden=true}
async function saveMappingFromModal(e){e.preventDefault();const target=state.mappingTarget;const warehouseSku=$('mappingWarehouseSku').value;if(!target||!target.skuCode){toast('没有可保存的 SHEIN SKU',true);return}if(!warehouseSku){toast('请选择仓库 SKU',true);$('mappingWarehouseSku').focus();return}const btn=$('saveMappingModal');btn.disabled=true;try{const r=await fetch('api/sku-mappings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({warehouseSku,sheinSku:target.skuCode})});if(!r.ok){toast('保存失败：'+await r.text(),true);return}const sku=target.skuCode;closeMappingModal();toast('SKU 映射已保存');await loadData(sku)}finally{btn.disabled=false}}
async function loadData(selectedSku=''){const r=await fetch('api/warehouse-relations');if(!r.ok){location.reload();return}const data=await r.json();state={...state,rows:data.rows||[],groups:data.groups||{},summary:data.summary||{},warehouseSkus:data.warehouseSkus||[]};$('shop').textContent=`${data.shop} · ${num(state.summary.productSkus)} SKU · 覆盖率 ${pct(state.summary.coverageRate)}`;$('warehouseFilter').innerHTML='<option value="all">全部仓库 SKU</option>'+state.warehouseSkus.map(w=>`<option value="${esc(w.warehouseSku)}">${esc(w.warehouseSku)}</option>`).join('');renderCards();render();const keep=selectedSku||((state.selected||{}).skuCode||'');const selected=keep?state.rows.find(r=>r.skuCode===keep):null;if(state.rows.length)showDetail(selected||state.rows.find(r=>r.mappingStatus==='mapped')||state.rows[0]);else showDetail(null)}
async function init(){await loadData();['search','statusFilter','shelfFilter','warehouseFilter'].forEach(id=>$(id).addEventListener('input',render));document.querySelectorAll('#viewMode button').forEach(btn=>btn.onclick=()=>{state.view=btn.dataset.view;state.sort=(state.view==='sku'||state.view==='unmapped')?['skuCode',1]:['skuCount',-1];document.querySelectorAll('#viewMode button').forEach(b=>b.classList.toggle('active',b===btn));render()});$('mappingModalForm').addEventListener('submit',saveMappingFromModal);$('closeMappingModal').onclick=closeMappingModal;$('cancelMappingModal').onclick=closeMappingModal;$('mappingModal').addEventListener('click',e=>{if(e.target===$('mappingModal'))closeMappingModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('mappingModal').hidden)closeMappingModal()})}
function renderCards(){const s=state.summary;const cards=[['仓库 SKU',num(s.enabledWarehouseSkus),`${num(s.warehouseSkus)} 个维护项`],['商品 SKU',num(s.productSkus),`${num(s.skcCount)} SKC / ${num(s.spuCount)} SPU`],['已映射',num(s.mappedProductSkus),`${num(s.mappedRows)} 条关联`,s.coverageRate>=.9?'good':''],['缺SKU映射',num(s.missingSkuMappings??s.unmappedProductSkus),s.defaultWarehouseSku?`无显式映射时使用默认仓库 ${s.defaultWarehouseSku}`:'无默认仓库',s.unmappedProductSkus?'warn':'good'],['缺商品资料',num(s.missingProductMappings),'映射表中存在但商品表未找到',s.missingProductMappings?'bad':'good'],['上架 SKU',num(s.activeSkus),`${num(s.offlineSkus)} 个下架`],['总库存',num(s.inventoryTotal),'按商品详情库存汇总'],['覆盖率',pct(s.coverageRate),'已映射商品 SKU 占比',s.coverageRate>=.9?'good':'warn']];$('cards').innerHTML=cards.map(c=>`<div class="card ${c[3]||''}"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${esc(c[2])}</div></div>`).join('')}
function filteredRows(){const q=$('search').value.trim().toLowerCase(),status=$('statusFilter').value,shelfVal=$('shelfFilter').value,wh=$('warehouseFilter').value;return state.rows.filter(r=>{const text=`${r.warehouseSku} ${r.effectiveWarehouseSku} ${r.skuCode} ${r.skcName} ${r.spuName} ${r.supplierSku} ${r.supplierCode} ${r.title} ${r.attributeSummary}`.toLowerCase();if(q&&!text.includes(q))return false;if(status!=='all'&&r.mappingStatus!==status)return false;if(wh!=='all'&&r.effectiveWarehouseSku!==wh)return false;if(shelfVal==='unknown'&&r.skcShelfStatus!==null&&r.skcShelfStatus!==undefined)return false;if((shelfVal==='0'||shelfVal==='1')&&String(r.skcShelfStatus)!==shelfVal)return false;return true})}
function groupFromRows(rows,key){
  const groups={};
  rows.forEach(r=>{const value=r[key]||'';if(!value)return;(groups[value]||(groups[value]=[])).push(r)});
  return Object.entries(groups).map(([key,items])=>{
    const defaultCount=items.filter(i=>i.mappingStatus==='default').length;
    const unmappedCount=items.filter(i=>i.mappingStatus==='unmapped').length;
    return {
      key,
      skuCount:new Set(items.map(i=>i.skuCode).filter(Boolean)).size,
      warehouseCount:new Set(items.map(i=>i.effectiveWarehouseSku).filter(Boolean)).size,
      skcCount:new Set(items.map(i=>i.skcName).filter(Boolean)).size,
      spuCount:new Set(items.map(i=>i.spuName).filter(Boolean)).size,
      mappedCount:items.filter(i=>i.mappingStatus==='mapped').length,
      defaultCount,
      unmappedCount,
      missingSkuMappingCount:defaultCount+unmappedCount,
      missingProductCount:items.filter(i=>i.mappingStatus==='missing_product').length,
      inventoryTotal:items.reduce((a,i)=>a+Number(i.inventoryTotal||0),0),
      activeSkuCount:items.filter(i=>i.skcShelfStatus===1).length,
      imageUrl:(items.find(i=>i.imageUrl)||{}).imageUrl||'',
      title:(items.find(i=>i.title)||{}).title||'',
      sampleSkus:items.slice(0,5).map(i=>i.skuCode).filter(Boolean)
    }
  })
}function groupRows(rows){if(state.view==='warehouse')return groupFromRows(rows,'effectiveWarehouseSku');if(state.view==='spu')return groupFromRows(rows,'spuName');if(state.view==='skc')return groupFromRows(rows,'skcName');return []}
function render(){const rows=filteredRows();state.visibleRows=rows;if(state.view==='sku'||state.view==='unmapped'){renderSkuTable(state.view==='unmapped'?rows.filter(r=>r.mappingStatus!=='mapped'):rows);return}renderGroupTable(groupRows(rows))}
function renderSkuTable(rows){$('tableTitle').textContent=state.view==='unmapped'?'缺SKU映射 / 异常 SKU':'SKU 明细';rows=sorted(rows);$('tableStatus').textContent=`${num(rows.length)} 行`;if(!rows.length){$('mainTable').innerHTML='<tr><td><div class="empty">暂无数据</div></td></tr>';return}const head='<tr><th data-k="mappingStatus">状态</th><th data-k="effectiveWarehouseSku">仓库 SKU</th><th data-k="skuCode">SHEIN SKU</th><th>商品</th><th data-k="skcShelfStatus">上架</th><th data-k="inventoryTotal" class="num">库存</th><th data-k="minPrice" class="num">价格</th><th>更新时间</th></tr>';const body=rows.map(r=>`<tr data-i="${state.rows.indexOf(r)}">${cell(statusCell(r))}${cell(`<span class="code">${esc(r.effectiveWarehouseSku||'-')}</span>${skuMappingHint(r)?`<span class="sub">${esc(skuMappingHint(r))}</span>`:''}`)}${cell(sheinSkuCell(r))}${cell(productCell(r))}${cell(shelf(r.skcShelfStatus))}${cell(num(r.inventoryTotal),'num')}${cell(money(r.minPrice),'num')}${cell(esc(r.mappingUpdatedAt||r.productLastSeenAt))}</tr>`).join('');$('mainTable').innerHTML=head+body;document.querySelectorAll('#mainTable th[data-k]').forEach(th=>th.onclick=()=>setSort(th.dataset.k,1));document.querySelectorAll('#mainTable tr[data-i]').forEach(tr=>tr.onclick=()=>showDetail(state.rows[Number(tr.dataset.i)]));document.querySelectorAll('[data-map-row]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();openMappingModal(Number(btn.dataset.mapRow))})}
function renderGroupTable(groups){
  const label={warehouse:'仓库 SKU',spu:'SPU',skc:'SKC'}[state.view];
  $('tableTitle').textContent=state.view==='skc'?'SKC 下 SKU 映射覆盖':'按'+label+'查看';
  $('tableStatus').textContent=`${num(groups.length)} 组`;
  if(!groups.length){$('mainTable').innerHTML='<tr><td><div class="empty">暂无数据</div></td></tr>';return}
  groups=sorted(groups);
  const showSkc=state.view!=='skc';
  const showSpu=state.view!=='spu';
  const head=`<tr><th data-k="key">${label}</th><th>样例</th><th data-k="skuCount" class="num">SHEIN SKU</th><th data-k="warehouseCount" class="num">仓库 SKU</th>${showSkc?'<th data-k="skcCount" class="num">SKC</th>':''}${showSpu?'<th data-k="spuCount" class="num">SPU</th>':''}<th data-k="mappedCount" class="num">SKU已映射</th><th data-k="missingSkuMappingCount" class="num">缺SKU映射</th><th data-k="missingProductCount" class="num">缺商品资料</th><th data-k="inventoryTotal" class="num">库存</th><th data-k="activeSkuCount" class="num">上架</th></tr>`;
  const body=groups.map(g=>{
    const missing=missingSkuMappingCount(g);
    const coverage=Math.min(100,(Number(g.mappedCount||0)/Math.max(1,Number(g.skuCount||0)))*100);
    return `<tr data-g="${esc(g.key)}"><td><span class="code">${esc(g.key)}</span><div class="bar"><i style="width:${coverage}%"></i></div>${missing?`<span class="sub">${missing} 个 SKU 缺仓库映射</span>`:''}</td><td>${g.imageUrl?`<img class="thumb" src="${esc(g.imageUrl)}" loading="lazy">`:''}<span class="sub">${esc(g.title||(g.sampleSkus||[]).join(' / '))}</span></td><td class="num">${num(g.skuCount)}</td><td class="num">${num(g.warehouseCount)}</td>${showSkc?`<td class="num">${num(g.skcCount)}</td>`:''}${showSpu?`<td class="num">${num(g.spuCount)}</td>`:''}<td class="num">${num(g.mappedCount)}</td><td class="num ${missing?'nowrap':''}">${missing?`<span class="badge warn">${num(missing)}</span>`:'0'}</td><td class="num">${g.missingProductCount?`<span class="badge purple">${num(g.missingProductCount)}</span>`:'0'}</td><td class="num">${num(g.inventoryTotal)}</td><td class="num">${num(g.activeSkuCount)}</td></tr>`
  }).join('');
  $('mainTable').innerHTML=head+body;
  document.querySelectorAll('#mainTable th[data-k]').forEach(th=>th.onclick=()=>setSort(th.dataset.k,-1));
  document.querySelectorAll('#mainTable tr[data-g]').forEach(tr=>tr.onclick=()=>showGroupDetail(groups.find(g=>g.key===tr.dataset.g)))
}function rowsForGroup(g){if(!g)return[];const key={warehouse:'effectiveWarehouseSku',spu:'spuName',skc:'skcName'}[state.view];return (state.visibleRows||state.rows).filter(r=>r[key]===g.key)}function showGroupDetail(g){const items=rowsForGroup(g);showDetail(items[0]||null,g)}
function detailList(title,rows,fmt){if(!rows||!rows.length)return '';return `<div class="section"><h3>${title}</h3><div class="mini-table">${rows.map(fmt).join('')}</div></div>`}
function showDetail(r,g=null){if(!r){$('detailSlot').className='side-empty';$('detailSlot').textContent='选择一行查看商品、价格和库存';return}state.selected=r;$('detailStatus').textContent=g?`${g.skuCount} SKU`:(r.mappingStatus==='mapped'?'手动映射':r.mappingStatus==='default'?'默认仓库':'待处理');const attr=[...(r.skcAttributes||[]),...(r.skuAttributes||[])];const mapAction=canMap(r)?`<div class="section"><button class="primary-btn" type="button" data-detail-map="${state.rows.indexOf(r)}">选择仓库 SKU</button></div>`:'';$('detailSlot').className='';$('detailSlot').innerHTML=`<div class="hero">${r.imageUrl?`<img src="${esc(r.imageUrl)}" loading="lazy">`:''}<div><p class="hero-title">${esc(r.title||r.attributeSummary||r.skuCode)}</p><div class="chips">${badge(r.mappingStatus)}${shelf(r.skcShelfStatus)}${r.spuShelfStatus===1?'<span class="badge blue">SPU上架</span>':r.spuShelfStatus===0?'<span class="badge warn">SPU下架</span>':''}</div></div></div><div class="kv"><div>仓库 SKU</div><div>${esc(r.effectiveWarehouseSku||'-')}</div><div>SHEIN SKU</div><div>${esc(r.skuCode)}</div><div>SKC</div><div>${esc(r.skcName||'-')}</div><div>SPU</div><div>${esc(r.spuName||'-')}</div><div>商家货号</div><div>${esc(r.supplierCode||'-')}</div><div>商家 SKU</div><div>${esc(r.supplierSku||'-')}</div><div>类目</div><div>${esc(r.categoryId||'-')}</div><div>价格</div><div>${esc(r.priceText||'-')}</div><div>成本</div><div>${esc(r.costText||'-')}</div><div>库存</div><div>${num(r.inventoryTotal)} · ${esc(r.inventoryText||'-')}</div></div>${attr.length?`<div class="section"><h3>属性</h3><div class="chips">${attr.map(a=>`<span class="chip">${esc(a.name)}: ${esc(a.value)}</span>`).join('')}</div></div>`:''}${detailList('站点价格',r.priceList,(p)=>`<div class="mini-row"><span>${esc(p.site||'-')} · ${esc(p.currency||'')}</span><span>${money(Number(p.specialPrice||0)>0?p.specialPrice:p.basePrice)}</span></div>`)}${detailList('成本',r.costList,(c)=>`<div class="mini-row"><span>${esc(c.currency||'-')}</span><span>${Number(c.cost||0).toFixed(2)}</span></div>`)}${detailList('库存',r.inventoryList,(i)=>`<div class="mini-row"><span>${esc(i.warehouseId||'-')}</span><span>${num(i.inventoryNum)}</span></div>`)}${detailList('站点上架',r.siteShelfStatusList,(s)=>`<div class="mini-row"><span>${esc(s.subSite||'-')}</span><span>${Number(s.status)===1?'上架':'下架'}</span></div>`)}${mapAction}`;const btn=$('detailSlot').querySelector('[data-detail-map]');if(btn)btn.onclick=e=>{e.stopPropagation();openMappingModal(Number(btn.dataset.detailMap))}}
init();
</script></body></html>
