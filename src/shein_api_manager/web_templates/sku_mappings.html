<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHEIN SKU 映射</title>
<style>
:root{--bg:#eef3f2;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d6dee4;--accent:#0f766e;--bad:#b42318;--warn:#b45309;--focus:#d6f3ee;--soft:#f8fafb;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}.shell{max-width:1680px;margin:0 auto;padding:18px 20px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.brand h1{font-size:25px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a.active{color:var(--accent);font-weight:800}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:82px}.card .k{font-size:12px;color:var(--muted);font-weight:750}.card .v{font-size:22px;font-weight:850;margin-top:8px}.card .s{font-size:12px;color:var(--muted);margin-top:3px}.card.warn .v{color:var(--warn)}.card.good .v{color:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.panel h2{margin:0;font-size:15px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tools input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:#fff;min-width:300px}.btn{height:36px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;padding:0 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.secondary{background:#fff;color:#344054;border:1px solid var(--line)}.btn.danger{background:#fff;color:var(--bad);border:1px solid #f3c3bf}.btn.small{height:28px;padding:0 8px;font-size:12px}.status,.hint{font-size:12px;color:var(--muted);line-height:1.45}.table-wrap{overflow:auto;max-height:780px;border:1px solid var(--line);border-radius:8px;background:#fff}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:8px 9px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#f8fafb;color:#344054;z-index:2}.warehouse-group-start td{border-top:3px solid #9fb3bd}.warehouse-group-end td{border-bottom:2px solid #c8d3da}.warehouse-cell{min-width:300px;background:#eef7f5;border-left:5px solid var(--accent);border-right:1px solid #b8c7cf;vertical-align:top}.warehouse-title{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}.warehouse-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}.sku{font-weight:850;color:#17202a;overflow-wrap:anywhere}.sku-code{display:inline-block;max-width:128px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}.warehouse-code{max-width:none;white-space:nowrap;overflow:visible;text-overflow:clip}.sub{display:block;margin-top:4px;color:var(--muted);font-size:12px;white-space:normal;line-height:1.3;max-width:420px}.data-cell{min-width:238px;max-width:252px;background:#f3f8f7;border-right:2px solid #b8c7cf;vertical-align:top}.warehouse-child td{background:#fff}.section-row td{background:#eef2f6!important;border-top:2px solid #b8c7cf;border-bottom:1px solid #c8d3da;color:#344054;font-weight:850}.section-row .sub{display:inline;margin-left:8px}.unmapped-section td{background:#fff7ed!important}.data-grid{display:grid;grid-template-columns:repeat(3,68px);gap:7px;align-items:end}.mini{display:grid;gap:3px}.mini span{font-size:10px;font-weight:850;color:var(--muted)}.inline-input,.inline-select{height:31px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);outline:0}.inline-input{width:68px;padding:0 6px;text-align:right}.inline-select{min-width:190px;padding:0 8px}.inline-input:focus,.inline-select:focus,.tools input:focus,.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.product-cell{display:flex;align-items:center;gap:8px;min-width:240px;max-width:320px}.thumb{width:38px;height:48px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#f3f4f6;flex:0 0 auto}.thumb.placeholder{display:grid;place-items:center;color:#98a2b3;font-size:11px;font-weight:850}.sku-meta{min-width:0}.product-title{display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750;color:#344054}.product-cell .sub{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-actions{display:flex;gap:6px;align-items:center}.badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;background:#e7f3f1;color:#0f766e;font-weight:800}.badge.warn{background:#fff1e7;color:#b45309}.badge.blue{background:#e8f0ff;color:#2563eb}.badge.bad{background:#fee4e2;color:#b42318}.unmapped-row td{background:#fffdf8}.unmatched-label-cell{width:300px;min-width:300px}.unmatched-data-cell{width:238px;min-width:238px;max-width:252px}.empty{padding:44px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:#fff}.modal{position:fixed;inset:0;background:rgba(15,23,42,.34);display:grid;place-items:center;padding:18px;z-index:20}.modal[hidden]{display:none}.modal-card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 24px 80px rgba(16,24,40,.24);padding:16px}.modal-card.wide{width:min(980px,calc(100vw - 36px));max-height:88vh;overflow:auto}.modal-tools{margin-bottom:12px}.modal-tools input{min-width:280px}.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}.thumb-card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;display:grid;gap:7px;text-align:left;cursor:pointer;color:var(--ink)}.thumb-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.thumb-card .thumb{width:100%;height:116px}.thumb-card .sku-code{max-width:100%}.thumb-card .product-title{max-width:100%;font-size:12px}.thumb-card .sub{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.modal-head h2{font-size:16px;margin:0}.close-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#344054;cursor:pointer}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:750;color:#344054}.field input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:0 10px;outline:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.toast{position:fixed;right:18px;bottom:18px;max-width:420px;background:#17202a;color:#fff;border-radius:8px;padding:12px 14px;font-size:13px;box-shadow:0 10px 30px rgba(16,24,40,.18);display:none;z-index:30}.toast.show{display:block}.toast.bad{background:#8f1d17}@media(max-width:1180px){.cards{grid-template-columns:repeat(3,1fr)}.panel-head{align-items:flex-start;flex-direction:column}.tools{width:100%}.tools input{min-width:0;width:100%}.data-grid{grid-template-columns:repeat(3,68px)}}@media(max-width:720px){.shell{padding:14px 12px 28px}.top{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr 1fr}.btn{flex:1}.data-grid{grid-template-columns:repeat(2,68px)}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><h1>SHEIN SKU 映射</h1><p id="shop">加载中...</p></div>
    <div class="nav"><a href="./">PNL</a><a href="logistics">物流分析</a><a href="shipping-fee">Shipping Fee</a><a href="returns">退货明细</a><a class="active" href="sku-mappings">SKU映射</a><a href="warehouse-relations">关联视图</a><a href="inventory">库存管理</a><a href="inventory-templates">成本模板</a><a href="logout">退出</a></div>
  </div>
  <div class="cards" id="cards"></div>
  <section class="panel">
    <div class="panel-head">
      <h2>仓库 SKU 主数据 / SHEIN SKU 映射</h2>
      <div class="tools">
        <input id="search" placeholder="搜索仓库 SKU / SHEIN SKU / SKC / 商品">
        <button class="btn" id="saveAllBtn" type="button" disabled>保存修改</button>
        <button class="btn secondary" id="cancelChangesBtn" type="button" disabled>取消修改</button>
        <button class="btn secondary" id="openWarehouseModal" type="button">新增仓库 SKU</button>
        <button class="btn secondary" id="openImportModal" type="button">导入</button>
        <a class="btn secondary" href="api/sku-mappings/template.xlsx">Excel模板</a>
        <a class="btn secondary" href="api/sku-mappings/export">导出</a>
        <span class="status" id="tableStatus"></span>
      </div>
    </div>
    <div id="tableSlot"></div>
  </section>
</div>

<div class="modal" id="warehouseModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><h2>新增仓库 SKU</h2><button class="close-btn" type="button" data-close="warehouseModal">×</button></div>
    <form id="warehouseForm">
      <div class="field"><label>仓库 SKU</label><input id="newWarehouseSku" autocomplete="off" placeholder="填写仓库 SKU"></div>
      <div class="modal-actions"><button class="btn secondary" type="button" data-close="warehouseModal">取消</button><button class="btn" type="submit">保存</button></div>
    </form>
  </div>
</div>

<div class="modal" id="importModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><h2>导入映射</h2><button class="close-btn" type="button" data-close="importModal">×</button></div>
    <div class="field"><label>Excel / CSV</label><input id="importFile" type="file" accept=".csv,.xlsx,.xlsm,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroenabled.12"></div>
    <div class="hint">列：warehouse_sku, shein_sku, length_cm, width_cm, height_cm, weight_kg, purchase_price, ocean_freight_price。</div>
    <div class="hint" id="importStatus"></div>
    <div class="modal-actions"><button class="btn secondary" type="button" data-close="importModal">取消</button><button class="btn" id="importBtn" type="button">导入</button></div>
  </div>
</div>
<div class="modal" id="addSheinModal" hidden>
  <div class="modal-card wide">
    <div class="modal-head"><h2>新增 SHEIN SKU 到 <span id="addWarehouseLabel"></span></h2><button class="close-btn" type="button" data-close="addSheinModal">×</button></div>
    <div class="tools modal-tools"><input id="addSheinSearch" placeholder="按缩略图、SHEIN SKU、SKC、商品搜索"><span class="status" id="addSheinStatus"></span></div>
    <div id="addSheinGrid" class="thumb-grid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={rows:[],unmappedRows:[],warehouseSkus:[],sheinSkus:[],settings:{},warehouseDrafts:{},mappingDrafts:{},addWarehouseSku:''};
const numberFields=['lengthCm','widthCm','heightCm','weightKg','purchasePrice','oceanFreightPrice'];
const fieldLabels={lengthCm:'长cm',widthCm:'宽cm',heightCm:'高cm',weightKg:'重量kg',purchasePrice:'采购',oceanFreightPrice:'海运'};
function toast(msg,bad=false){const el=$('toast');el.textContent=msg;el.className='toast show'+(bad?' bad':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.className='toast',3000)}
function hasValue(v){return v!==null&&v!==undefined&&v!==''}
function num(v,d=3){if(!hasValue(v))return '';const n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:d}):''}
function fmtMoney(v){if(!hasValue(v))return '';const n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):''}
function inputValue(v){return hasValue(v)?String(v):''}
function optionalNumber(v){const text=String(v??'').trim();return text===''?null:Number(text)}
function sameNumber(a,b){const av=optionalNumber(a),bv=optionalNumber(b);return av===bv||(Number.isNaN(av)&&Number.isNaN(bv))}
function skuMeta(code){return state.sheinSkus.find(s=>s.sku===code)||{}}
function imageMarkup(url){return url?`<img class="thumb" src="${esc(url)}" alt="" loading="lazy">`:'<div class="thumb placeholder">SKU</div>'}
function warehouseBase(w){return {warehouseSku:w.warehouseSku||'',lengthCm:w.lengthCm??null,widthCm:w.widthCm??null,heightCm:w.heightCm??null,weightKg:w.weightKg??null,purchasePrice:w.purchasePrice??null,oceanFreightPrice:w.oceanFreightPrice??null}}
function currentWarehouse(w){return state.warehouseDrafts[w.warehouseSku]||warehouseBase(w)}
function warehouseChanged(base,next){return numberFields.some(k=>!sameNumber(base[k],next[k]))}
function allMappingRows(){return [...state.rows.map(r=>({...r,type:'mapped'})),...state.unmappedRows.map(r=>({...r,type:'unmapped',id:null,warehouseSku:''}))]}
function mappingBase(row){return {id:row.id||null,sheinSku:row.sheinSku,warehouseSku:row.warehouseSku||''}}
function currentMapping(row){return state.mappingDrafts[row.sheinSku]||mappingBase(row)}
function mappingChanged(base,next){return (base.warehouseSku||'')!==(next.warehouseSku||'')}
function dirtyWarehouses(){return state.warehouseSkus.map(w=>({base:warehouseBase(w),draft:currentWarehouse(w)})).filter(x=>warehouseChanged(x.base,x.draft))}
function dirtyMappings(){const bySku=new Map(allMappingRows().map(r=>[r.sheinSku,r]));return Object.entries(state.mappingDrafts).map(([sku,draft])=>({row:bySku.get(sku),draft})).filter(x=>x.row&&mappingChanged(mappingBase(x.row),x.draft))}
function dirtyCount(){return dirtyWarehouses().length+dirtyMappings().length}
function hasUnsavedChanges(){return dirtyCount()>0}
function updateSaveButton(){const count=dirtyCount();$('saveAllBtn').disabled=!count;$('cancelChangesBtn').disabled=!count;$('saveAllBtn').textContent=count?`保存修改 ${count}`:'保存修改';$('cancelChangesBtn').textContent=count?`取消修改 ${count}`:'取消修改'}
function warehouseOptions(selected=''){const seen=new Set();const opts=state.warehouseSkus.filter(w=>w.warehouseSku).map(w=>{seen.add(w.warehouseSku);return `<option value="${esc(w.warehouseSku)}" ${w.warehouseSku===selected?'selected':''}>${esc(w.warehouseSku)}</option>`});if(selected&&!seen.has(selected))opts.unshift(`<option value="${esc(selected)}" selected>${esc(selected)}</option>`);return '<option value="">选择仓库 SKU</option>'+opts.join('')}
function productText(row){const meta={...skuMeta(row.sheinSku),...row};return [meta.title,meta.sheinSkuLabel||meta.label,meta.skcName?`SKC ${meta.skcName}`:'',meta.spuName?`SPU ${meta.spuName}`:''].filter(Boolean).join(' · ')}
function productCell(row){const meta={...skuMeta(row.sheinSku),...row};const title=productText(row)||row.sheinSku;return `<div class="product-cell">${imageMarkup(meta.imageUrl)}<div class="sku-meta"><span class="product-title" title="${esc(title)}">${esc(title)}</span>${meta.skcName||meta.spuName?`<span class="sub">${esc([meta.skcName?`SKC ${meta.skcName}`:'',meta.spuName?`SPU ${meta.spuName}`:''].filter(Boolean).join(' · '))}</span>`:''}</div></div>`}
function dataGrid(w){const d=currentWarehouse(w);return `<div class="data-grid">${numberFields.map(k=>`<label class="mini"><span>${fieldLabels[k]}</span><input class="inline-input" type="number" min="0" step="0.001" inputmode="decimal" value="${esc(inputValue(d[k]))}" data-wh="${esc(w.warehouseSku)}" data-wh-field="${k}"></label>`).join('')}</div>`}
function groups(){const byWh=new Map();state.warehouseSkus.forEach(w=>byWh.set(w.warehouseSku,{warehouse:w,children:[]}));state.rows.forEach(r=>{const sku=r.warehouseSku||'';if(!sku)return;if(!byWh.has(sku))byWh.set(sku,{warehouse:{warehouseSku:sku},children:[]});byWh.get(sku).children.push(r)});return [...byWh.values()].sort((a,b)=>String(a.warehouse.warehouseSku).localeCompare(String(b.warehouse.warehouseSku)))}
function filterTextForGroup(g){return `${g.warehouse.warehouseSku} ${numberFields.map(k=>currentWarehouse(g.warehouse)[k]||'').join(' ')} ${g.children.map(c=>`${c.sheinSku} ${productText(c)}`).join(' ')}`.toLowerCase()}
function filteredGroups(){const q=$('search').value.trim().toLowerCase();return groups().filter(g=>!q||filterTextForGroup(g).includes(q))}
function filteredUnmapped(){const q=$('search').value.trim().toLowerCase();return state.unmappedRows.filter(r=>!q||`${r.sheinSku} ${productText(r)}`.toLowerCase().includes(q))}
function renderCards(){const mapped=state.rows.length,unmapped=state.unmappedRows.length,warehouse=state.warehouseSkus.length,multi=groups().filter(g=>g.children.length>1).length,missingData=state.warehouseSkus.filter(w=>numberFields.some(k=>!hasValue(w[k]))).length;const cards=[['仓库 SKU',warehouse,'主数据维护项'],['SHEIN 映射',mapped,`${multi} 个仓库 SKU 关联多个 SHEIN SKU`,'good'],['未匹配',unmapped,'商品 SKU 待归属',unmapped?'warn':'good'],['主数据缺项',missingData,'尺寸、重量或成本为空',missingData?'warn':'good'],['默认仓库',state.settings?.warehouseSku||'-','未显式映射时使用']];$('cards').innerHTML=cards.map(c=>`<div class="card ${c[3]||''}"><div class="k">${esc(c[0])}</div><div class="v">${esc(c[1])}</div><div class="s">${esc(c[2])}</div></div>`).join('')}
function renderTable(){const gRows=filteredGroups(),unmapped=filteredUnmapped();const dirty=dirtyCount();$('tableStatus').textContent=`${gRows.length} 个仓库 SKU / ${state.rows.length} 条映射 / ${unmapped.length} 个未匹配${dirty?` / ${dirty} 条未保存`:''}`;updateSaveButton();if(!gRows.length&&!unmapped.length){$('tableSlot').innerHTML='<div class="empty">暂无 SKU 映射</div>';return}let html='<div class="table-wrap"><table><thead><tr><th>仓库 SKU</th><th>仓库主数据</th><th>SHEIN SKU</th><th>商品</th><th>归属</th><th>操作</th></tr></thead><tbody>';
if(unmapped.length){html+=`<tr class="section-row unmapped-section"><td colspan="6"><span class="badge warn">未匹配 SHEIN SKU</span><span class="sub">优先处理，可直接选择仓库 SKU</span></td></tr>`;unmapped.forEach(row=>{const draft=currentMapping({...row,type:'unmapped',warehouseSku:''});html+=`<tr class="unmapped-row"><td class="unmatched-label-cell"><span class="badge warn">未匹配</span></td><td class="unmatched-data-cell"><span class="sub">-</span></td><td><span class="sku sku-code" title="${esc(row.sheinSku)}">${esc(row.sheinSku)}</span></td><td>${productCell(row)}</td><td><select class="inline-select" data-map-sku="${esc(row.sheinSku)}">${warehouseOptions(draft.warehouseSku)}</select></td><td></td></tr>`})}
if(gRows.length){html+=`<tr class="section-row"><td colspan="6"><span class="badge blue">仓库 SKU</span><span class="sub">按仓库 SKU 维护成本、重量和尺寸</span></td></tr>`}
gRows.forEach(g=>{const children=g.children.length?g.children:[{empty:true,sheinSku:'',warehouseSku:g.warehouse.warehouseSku}];const span=children.length;children.forEach((child,idx)=>{const draft=child.empty?null:currentMapping(child);const rowClass=`warehouse-child ${idx===0?'warehouse-group-start':''} ${idx===children.length-1?'warehouse-group-end':''}`.trim();html+=`<tr class="${rowClass}">${idx===0?`<td class="warehouse-cell" rowspan="${span}"><div class="warehouse-title"><span class="sku sku-code warehouse-code" title="${esc(g.warehouse.warehouseSku)}">${esc(g.warehouse.warehouseSku)}</span><div class="warehouse-actions"><span class="badge blue">${g.children.length} SHEIN</span><button class="btn secondary small" type="button" data-add-shein="${esc(g.warehouse.warehouseSku)}">新增 SHEIN</button></div></div>${g.warehouse.updatedAt?`<span class="sub">更新 ${esc(g.warehouse.updatedAt)}</span>`:''}</td><td class="data-cell" rowspan="${span}">${dataGrid(g.warehouse)}</td>`:''}${child.empty?`<td><span class="badge warn">无 SHEIN SKU</span></td><td><span class="sub">-</span></td><td><span class="sub">-</span></td><td></td>`:`<td><span class="sku sku-code" title="${esc(child.sheinSku)}">${esc(child.sheinSku)}</span></td><td>${productCell(child)}</td><td><select class="inline-select" data-map-sku="${esc(child.sheinSku)}">${warehouseOptions(draft.warehouseSku)}</select></td><td><div class="row-actions"><button class="btn danger small" type="button" data-del="${child.id}">删除</button></div></td>`}</tr>`})});
html+='</tbody></table></div>';$('tableSlot').innerHTML=html;document.querySelectorAll('[data-wh-field]').forEach(el=>{el.addEventListener('input',()=>updateWarehouseDraft(el));el.addEventListener('change',()=>updateWarehouseDraft(el))});document.querySelectorAll('[data-map-sku]').forEach(el=>el.addEventListener('change',()=>updateMappingDraft(el)));document.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=()=>deleteRow(Number(btn.dataset.del)));document.querySelectorAll('[data-add-shein]').forEach(btn=>btn.onclick=()=>openAddSheinModal(btn.dataset.addShein))}
function updateWarehouseDraft(el){const sku=el.dataset.wh,w=state.warehouseSkus.find(x=>x.warehouseSku===sku);if(!w)return;const base=currentWarehouse(w),next={...base,[el.dataset.whField]:optionalNumber(el.value)};if(warehouseChanged(warehouseBase(w),next))state.warehouseDrafts[sku]=next;else delete state.warehouseDrafts[sku];updateSaveButton();$('tableStatus').textContent=$('tableStatus').textContent.replace(/\s\/\s\d+ 条未保存$/,'')+(dirtyCount()?` / ${dirtyCount()} 条未保存`:'')}
function updateMappingDraft(el){const sku=el.dataset.mapSku,row=allMappingRows().find(x=>x.sheinSku===sku);if(!row)return;const base=currentMapping(row),next={...base,warehouseSku:el.value};if(mappingChanged(mappingBase(row),next))state.mappingDrafts[sku]=next;else delete state.mappingDrafts[sku];updateSaveButton();$('tableStatus').textContent=$('tableStatus').textContent.replace(/\s\/\s\d+ 条未保存$/,'')+(dirtyCount()?` / ${dirtyCount()} 条未保存`:'')}
function validate(){for(const item of dirtyWarehouses()){for(const k of numberFields){const v=item.draft[k];if(v!==null&&!Number.isFinite(Number(v)))return '仓库主数据必须是数字'}}for(const item of dirtyMappings()){if(!item.draft.warehouseSku)return '请选择仓库 SKU'}return ''}
async function saveAllChanges(){const err=validate();if(err){toast(err,true);return}const wh=dirtyWarehouses(),maps=dirtyMappings();if(!wh.length&&!maps.length){toast('没有需要保存的修改');return}$('saveAllBtn').disabled=true;$('saveAllBtn').textContent='保存中';let saved=0;for(const item of wh){const r=await fetch('api/warehouse-skus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item.draft)});if(!r.ok){toast('仓库 SKU 保存失败：'+await r.text(),true);updateSaveButton();return}saved++}for(const item of maps){const payload={...item.draft};if(item.row.id)payload.id=item.row.id;const r=await fetch('api/sku-mappings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok){toast('SKU 映射保存失败：'+await r.text(),true);updateSaveButton();return}saved++}state.warehouseDrafts={};state.mappingDrafts={};toast(`保存成功：${saved} 条`);await loadRows()}
function cancelChanges(){const count=dirtyCount();if(!count)return;if(!confirm(`取消 ${count} 条未保存修改？`))return;state.warehouseDrafts={};state.mappingDrafts={};renderCards();renderTable();toast('已取消未保存修改')}
async function deleteRow(id){if(!id)return;if(hasUnsavedChanges()&&!confirm('当前有未保存修改，继续删除会先放弃这些修改。确定继续？'))return;const row=state.rows.find(r=>r.id===id);if(!row||!confirm(`删除映射：${row.warehouseSku} -> ${row.sheinSku}？`))return;const r=await fetch(`api/sku-mappings/${id}`,{method:'DELETE'});if(!r.ok){toast('删除失败：'+await r.text(),true);return}state.warehouseDrafts={};state.mappingDrafts={};toast('已删除');await loadRows()}
function addSheinMatches(){const q=$('addSheinSearch').value.trim().toLowerCase();return state.unmappedRows.filter(row=>!q||`${row.sheinSku} ${productText(row)}`.toLowerCase().includes(q))}
function addSheinCard(row){const meta={...skuMeta(row.sheinSku),...row};const title=productText(row)||row.sheinSku;const skc=[meta.skcName?`SKC ${meta.skcName}`:'',meta.spuName?`SPU ${meta.spuName}`:''].filter(Boolean).join(' · ');return `<button class="thumb-card" type="button" data-add-sku="${esc(row.sheinSku)}"><div>${imageMarkup(meta.imageUrl)}</div><span class="sku sku-code" title="${esc(row.sheinSku)}">${esc(row.sheinSku)}</span><span class="product-title" title="${esc(title)}">${esc(title)}</span>${skc?`<span class="sub" title="${esc(skc)}">${esc(skc)}</span>`:''}</button>`}
function renderAddSheinGrid(){const rows=addSheinMatches();$('addSheinStatus').textContent=`${rows.length} 个未匹配 SHEIN SKU`;$('addSheinGrid').innerHTML=rows.length?rows.map(addSheinCard).join(''):'<div class="empty">没有可新增的未匹配 SHEIN SKU</div>';document.querySelectorAll('[data-add-sku]').forEach(btn=>btn.onclick=()=>assignSheinToWarehouse(btn.dataset.addSku))}
function openAddSheinModal(warehouseSku){if(hasUnsavedChanges()){toast('请先保存当前修改后再新增 SHEIN SKU',true);return}state.addWarehouseSku=warehouseSku;$('addWarehouseLabel').textContent=warehouseSku;$('addSheinSearch').value='';renderAddSheinGrid();openModal('addSheinModal')}
async function assignSheinToWarehouse(sheinSku){const warehouseSku=state.addWarehouseSku;if(!warehouseSku||!sheinSku)return;const r=await fetch('api/sku-mappings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({warehouseSku,sheinSku})});if(!r.ok){toast('新增 SHEIN SKU 失败：'+await r.text(),true);return}toast(`已匹配 ${sheinSku}`);await loadRows();state.addWarehouseSku=warehouseSku;$('addWarehouseLabel').textContent=warehouseSku;renderAddSheinGrid()}
async function saveWarehouseSku(e){e.preventDefault();const sku=$('newWarehouseSku').value.trim();if(!sku){toast('请填写仓库 SKU',true);return}const r=await fetch('api/warehouse-skus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({warehouseSku:sku})});if(!r.ok){toast('仓库 SKU 保存失败：'+await r.text(),true);return}$('newWarehouseSku').value='';closeModal('warehouseModal');toast('仓库 SKU 已加入');await loadRows()}
async function importFile(){const file=$('importFile').files[0];if(!file){toast('请选择 Excel 或 CSV 文件',true);return}const fd=new FormData();fd.append('file',file);$('importStatus').textContent='正在导入...';const r=await fetch('api/sku-mappings/import',{method:'POST',body:fd});if(!r.ok){$('importStatus').textContent='';toast('导入失败：'+await r.text(),true);return}const data=await r.json();$('importStatus').textContent=`新增 ${data.inserted} 条，更新 ${data.updated} 条，跳过 ${data.skipped} 条`;toast('导入完成');await loadRows()}
async function loadRows(){const r=await fetch('api/sku-mappings');if(!r.ok){location.reload();return}const data=await r.json();state={...state,rows:data.rows||[],unmappedRows:data.unmappedRows||[],warehouseSkus:data.warehouseSkus||[],sheinSkus:data.sheinSkus||[],settings:data.settings||{},warehouseDrafts:{},mappingDrafts:{}};$('shop').textContent=`${data.shop} · 仓库 SKU 主数据`;renderCards();renderTable()}
function openModal(id){$(id).hidden=false;const input=$(id).querySelector('input');if(input)setTimeout(()=>input.focus(),0)}
function closeModal(id){$(id).hidden=true}
$('saveAllBtn').onclick=saveAllChanges;$('cancelChangesBtn').onclick=cancelChanges;$('openWarehouseModal').onclick=()=>openModal('warehouseModal');$('openImportModal').onclick=()=>openModal('importModal');$('warehouseForm').addEventListener('submit',saveWarehouseSku);$('search').oninput=()=>{renderCards();renderTable()};$('addSheinSearch').oninput=renderAddSheinGrid;$('importBtn').onclick=importFile;document.querySelectorAll('[data-close]').forEach(btn=>btn.onclick=()=>closeModal(btn.dataset.close));document.querySelectorAll('.modal').forEach(modal=>modal.addEventListener('click',e=>{if(e.target===modal)closeModal(modal.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal:not([hidden])').forEach(m=>closeModal(m.id))});window.addEventListener('beforeunload',e=>{if(!hasUnsavedChanges())return;e.preventDefault();e.returnValue=''});document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',e=>{if(hasUnsavedChanges()&&!confirm('有未保存修改，离开页面会丢失。确定离开？'))e.preventDefault()}));loadRows();
</script>
