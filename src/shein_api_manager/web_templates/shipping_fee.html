<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHEIN Shipping Fee 达成率</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--bg:#eef3f2;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d6dee4;--accent:#0f766e;--blue:#2563eb;--warn:#b45309;--bad:#b42318;--good:#087443;--purple:#6d28d9;--soft:#f8fafb;--focus:#d6f3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}.shell{max-width:1680px;margin:0 auto;padding:18px 20px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.brand h1{font-size:25px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a.active{color:var(--accent);font-weight:800}.filters{display:grid;grid-template-columns:180px 110px 160px 160px auto;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:750;color:#344054;margin-bottom:6px}.field select,.field input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:#fff;color:var(--ink);outline:0}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.actions{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}.btn{height:40px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:850;padding:0 18px;cursor:pointer}.btn:disabled{opacity:.62;cursor:wait}.hint,.status{font-size:12px;color:var(--muted);line-height:1.45}.window-section{margin-bottom:14px}.window-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:10px}.window-title h2{margin:0;font-size:15px}.window-title .status{display:block;margin-top:4px}.window-settings{display:grid;grid-template-columns:120px 120px 120px auto;gap:8px;align-items:end}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 14px;min-height:88px}.card .k{font-size:12px;color:var(--muted);font-weight:750}.card .v{font-size:23px;font-weight:850;margin-top:8px;letter-spacing:0}.card .s{font-size:12px;color:var(--muted);margin-top:4px}.card.good .v{color:var(--good)}.card.bad .v{color:var(--bad)}.card.warn .v{color:var(--warn)}.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.panel h2{margin:0;font-size:15px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.trend-picker{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,250px);gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:8px}.trend-option{height:76px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:9px;align-items:center;text-align:left;color:var(--ink);cursor:pointer}.trend-option:hover{border-color:var(--accent)}.trend-option.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus);background:#fbfefd}.trend-thumb{width:56px;height:56px;border:1px solid var(--line);border-radius:6px;object-fit:cover;background:#f3f4f6}.trend-thumb.placeholder{display:grid;place-items:center;color:#98a2b3;font-size:11px;font-weight:850}.trend-copy{min-width:0;display:grid;gap:4px}.trend-name{font-size:12px;font-weight:850;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.trend-code{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chart{width:100%;height:380px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tools input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;min-width:320px;background:#fff}.table-wrap{overflow:auto;max-height:680px;border:1px solid var(--line);border-radius:8px;background:#fff}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:right;vertical-align:middle}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#f8fafb;color:#344054;z-index:1;cursor:pointer}.code{font-weight:850;color:#17202a;overflow-wrap:anywhere}.sub{display:block;margin-top:3px;color:var(--muted);font-size:12px;white-space:normal;max-width:360px;text-align:left}.badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;background:#e7f3f1;color:#0f766e;font-weight:800}.empty{padding:44px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:#fff}.pos{color:var(--good);font-weight:850}.neg{color:var(--bad);font-weight:850}.zero{color:var(--muted);font-weight:750}@media(max-width:1320px){.cards{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(3,1fr)}.actions{grid-column:1/-1}.window-toolbar{align-items:flex-start;flex-direction:column}.window-settings{width:100%;grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.shell{padding:14px 12px 28px}.top,.panel-head{align-items:flex-start;flex-direction:column}.window-settings{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.tools input{min-width:0;width:100%}.chart{height:320px}.btn{width:100%}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="brand"><h1>Shipping Fee 达成率</h1><p id="shop">加载中...</p></div><div class="nav"><a href="./">PNL</a><a href="logistics">物流分析</a><a class="active" href="shipping-fee">Shipping Fee</a><a href="returns">退货明细</a><a href="sku-mappings">SKU映射</a><a href="warehouse-relations">关联视图</a><a href="inventory">库存管理</a><a href="inventory-templates">成本模板</a><a href="logout">退出</a></div></div>
  <div class="filters">
    <div class="field"><label>拆分维度</label><select id="dimension"></select></div>
    <div class="field"><label>候选数量</label><input id="topN" type="number" min="1" max="50" step="1"></div>
    <div class="field"><label>开始日期</label><input id="start" type="date"></div>
    <div class="field"><label>结束日期</label><input id="end" type="date"></div>
    <div class="actions"><button class="btn" id="apply" type="button">刷新数据</button><button class="btn" id="syncLatest" type="button">抓取最新数据</button><div class="hint" id="rangeHint"></div></div>
  </div>
  <div class="grid">
    <div class="panel"><div class="panel-head"><h2>Shipping Fee 日达成率趋势</h2><span class="status" id="dailyStatus"></span></div><div class="trend-picker" id="groupPicker"></div><div id="dailyChart" class="chart"></div></div>
  </div>
  <section class="window-section">
    <div class="window-toolbar">
      <div class="window-title"><h2>当前窗口对照</h2><span class="status" id="windowStatus"></span></div>
      <div class="window-settings">
        <div class="field"><label>Rolling 天数</label><input id="rolling" type="number" min="1" max="90" step="1"></div>
        <div class="field"><label>Min Period</label><input id="minPeriods" type="number" min="1" max="90" step="1"></div>
        <div class="field"><label>Shift 天数</label><input id="shift" type="number" min="1" max="90" step="1"></div>
        <button class="btn" id="windowApply" type="button">更新对照</button>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </section>
  <div class="panel"><div class="panel-head"><h2>维度明细</h2><div class="tools"><input id="search" placeholder="搜索维度"><span class="status" id="tableStatus"></span></div></div><div class="table-wrap"><table id="detailTable"></table></div></div>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const fmtNum=v=>Number(v||0).toLocaleString();const fmtMoney=v=>'$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const fmtPct=v=>(v===null||v===undefined||Number.isNaN(Number(v)))?'-':(Number(v)*100).toFixed(2)+'%';const fmtPp=v=>{if(v===null||v===undefined||Number.isNaN(Number(v)))return '-';const n=Number(v)*100;return `${n>0?'+':''}${n.toFixed(2)}pp`};const ppCls=v=>v===null||v===undefined||Number.isNaN(Number(v))?'zero':Number(v)>0?'pos':Number(v)<0?'neg':'zero';const val=id=>$(id).value;const dateText=v=>String(v||'').slice(0,10);const cell=(v,cls='')=>`<td class="${cls}">${v??''}</td>`;let state={summary:{},groups:[],series:[],table:[],selectedGroupKey:null,sort:['changePp',-1]};const charts={daily:null};function chart(name){if(!charts[name])charts[name]=echarts.init($(name+'Chart'));return charts[name]}
async function init(){const r=await fetch('api/shipping-fee/filters');if(!r.ok){location.reload();return}const data=await r.json();$('shop').textContent=data.shop;const d=data.defaults||{};$('rolling').value=d.rollingDays||7;$('minPeriods').value=d.minPeriods||d.rollingDays||7;$('minPeriods').max=$('rolling').value;$('shift').value=d.shiftDays||7;$('topN').value=d.topN||12;$('dimension').innerHTML=(data.dimensions||[]).map(item=>`<option value="${esc(item.value)}">${esc(item.label)}</option>`).join('');$('dimension').value=d.dimension||'warehouse_sku';$('start').value=dateText(data.minTime);$('end').value=dateText(data.maxTime);$('rangeHint').textContent=`${dateText(data.minTime)} 至 ${dateText(data.maxTime)}`;$('apply').onclick=loadData;$('syncLatest').onclick=syncLatest;$('windowApply').onclick=loadData;$('search').oninput=renderTable;$('rolling').oninput=syncMinPeriods;await loadData()}
async function loadData(){const qs=new URLSearchParams();if(val('start'))qs.set('start',val('start'));if(val('end'))qs.set('end',val('end'));qs.set('rolling',val('rolling')||7);qs.set('minPeriods',val('minPeriods')||val('rolling')||7);qs.set('shift',val('shift')||7);qs.set('dimension',val('dimension')||'warehouse_sku');qs.set('topN',val('topN')||12);const buttons=[$('apply'),$('windowApply')];buttons.forEach(button=>button.disabled=true);try{const r=await fetch('api/shipping-fee/data?'+qs.toString());if(!r.ok){alert('加载失败：'+await r.text());return}const data=await r.json();const groups=data.groups||[];const selectedGroupKey=groups.some(g=>g.key===state.selectedGroupKey)?state.selectedGroupKey:(groups[0]?.key??null);state={...state,summary:data.summary||{},groups,series:data.series||[],table:data.table||[],selectedGroupKey};renderGroupPicker();renderCards();renderCharts();renderTable()}finally{buttons.forEach(button=>button.disabled=false)}}
async function syncLatest(){const btn=$('syncLatest'),buttons=[btn,$('apply'),$('windowApply')],old=btn.textContent;buttons.forEach(button=>button.disabled=true);btn.textContent='抓取中...';$('rangeHint').textContent='正在抓取最新订单并重建利润数据...';try{const r=await fetch('api/shipping-fee/sync-latest',{method:'POST'});if(!r.ok)throw new Error(await r.text());const data=await r.json(),orders=data.sync?.orders||{},exported=data.export||{};$('rangeHint').textContent=`抓取完成：订单 ${fmtNum(orders.ordersSeen||0)} 单，利润表 ${fmtNum(exported.item_rows||0)} 行，正在刷新页面...`;setTimeout(()=>location.reload(),500)}catch(err){alert('抓取 Shipping Fee 最新数据失败：'+err.message);$('rangeHint').textContent='抓取失败';buttons.forEach(button=>button.disabled=false);btn.textContent=old}}
function selectedGroup(){return state.groups.find(g=>g.key===state.selectedGroupKey)||null}function selectedRow(){return state.table.find(r=>r.groupKey===state.selectedGroupKey)||null}function renderCards(){const s=state.summary||{},r=selectedRow(),change=r?.changePp??s.changePp;$('windowStatus').textContent=`Rolling ${s.rollingDays||0}D · Min ${s.minPeriods||0}D · Shift ${s.shiftDays||0}D`;const cards=[['Rolling 达成率',fmtPct(r?.currentRate??s.currentRate),`${s.currentWindowStart||''} 至 ${s.currentWindowEnd||''}`],['Shift 对照',fmtPct(r?.shiftedRate??s.shiftedRate),`${s.shiftedWindowStart||''} 至 ${s.shiftedWindowEnd||''}`],['当前变化',fmtPp(change),'Rolling 达成率 - Shift 达成率',change>0?'good':change<0?'bad':''],['区间达成率',fmtPct(r?.periodRate??s.periodRate),`${s.startDate||''} 至 ${s.endDate||''}`],['区间订单',fmtNum(r?.periodOrders??s.periodOrders),'当前选择'],['Shipping Fee',fmtMoney(r?.periodShippingRevenue??s.periodShippingRevenue),'当前选择']];$('cards').innerHTML=cards.map(c=>`<div class="card ${c[3]||''}"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${c[2]}</div></div>`).join('')}
function syncMinPeriods(){const rolling=Math.max(1,Number(val('rolling')||1)),input=$('minPeriods');input.max=rolling;if(!input.value||Number(input.value)>rolling)input.value=rolling}
function groupTitle(g){return g?.title||g?.label||'未命名'}function groupCode(g){return [g?.label,g?.sheinSku&&g.sheinSku!==g.label?g.sheinSku:''].filter(Boolean).join(' · ')}function groupImage(g){return g?.imageUrl?`<img class="trend-thumb" src="${esc(g.imageUrl)}" alt="" loading="lazy">`:'<div class="trend-thumb placeholder">SKU</div>'}
function renderGroupPicker(){const groups=state.groups||[];$('groupPicker').innerHTML=groups.length?groups.map(g=>`<button class="trend-option ${g.key===state.selectedGroupKey?'active':''}" type="button" data-group-key="${esc(g.key)}" title="${esc(groupTitle(g))}">${groupImage(g)}<span class="trend-copy"><span class="trend-name">${esc(groupTitle(g))}</span><span class="trend-code">${esc(groupCode(g))}</span></span></button>`).join(''):'<div class="empty">暂无趋势对象</div>';document.querySelectorAll('[data-group-key]').forEach(btn=>btn.onclick=()=>{state.selectedGroupKey=btn.dataset.groupKey;document.querySelectorAll('[data-group-key]').forEach(item=>item.classList.toggle('active',item.dataset.groupKey===state.selectedGroupKey));renderCards();renderCharts()})}
function dateRows(rows){return [...new Set(rows.map(r=>dateText(r.day)))].sort()}
function renderCharts(){renderDailyChart()}
function renderDailyChart(){const g=selectedGroup(),rows=(state.series||[]).filter(r=>r.groupKey===state.selectedGroupKey),dates=dateRows(rows),m=new Map(rows.map(r=>[dateText(r.day),r]));$('dailyStatus').textContent=g?`${groupTitle(g)} · ${fmtNum(dates.length)} 天`:'暂无选择';const series=g?[{name:groupTitle(g),type:'line',smooth:true,showSymbol:false,connectNulls:false,data:dates.map(d=>m.get(d)?.rate??null)}]:[];chart('daily').setOption({color:['#2563eb'],tooltip:{trigger:'axis',valueFormatter:fmtPct},legend:{show:false},grid:{left:58,right:28,top:24,bottom:58},toolbox:{right:8,feature:{saveAsImage:{}}},dataZoom:[{type:'inside'},{type:'slider',height:22,bottom:10}],xAxis:{type:'category',data:dates,axisLabel:{color:'#667085'}},yAxis:{type:'value',min:0,max:1,axisLabel:{formatter:v=>(Number(v)*100).toFixed(0)+'%'},splitLine:{lineStyle:{type:'dashed'}}},series},true)}
const numCols=new Set(['currentRate','shiftedRate','changePp','periodRate','periodOrders','periodShippingRevenue']);function cmp(a,b,key,dir){if(numCols.has(key)){const av=Number(a[key]??-Infinity),bv=Number(b[key]??-Infinity);return (av===bv?0:av>bv?1:-1)*dir}return String(a[key]??'').localeCompare(String(b[key]??''))*dir}function sortBy(key){const cur=state.sort;state.sort=cur[0]===key?[key,-cur[1]]:[key,-1];renderTable()}
function renderTable(){const q=$('search').value.trim().toLowerCase();let rows=(state.table||[]).filter(r=>`${r.groupLabel} ${r.groupKey}`.toLowerCase().includes(q));const [key,dir]=state.sort;rows=[...rows].sort((a,b)=>cmp(a,b,key,dir));$('tableStatus').textContent=`${rows.length} 组`;if(!rows.length){$('detailTable').innerHTML='<tr><td><div class="empty">暂无 shipping fee 达成率数据</div></td></tr>';return}const head='<tr><th data-k="groupLabel">维度</th><th data-k="currentRate">当前达成率</th><th data-k="shiftedRate">Shift 达成率</th><th data-k="changePp">上升/下降</th><th data-k="periodRate">区间达成率</th><th data-k="periodOrders">订单</th><th data-k="periodShippingRevenue">Shipping Fee</th></tr>';const body=rows.map(r=>`<tr>${cell(`<span class="code">${esc(r.groupLabel||'-')}</span><span class="sub">${esc(r.groupKey||'')}</span>`)}${cell(fmtPct(r.currentRate))}${cell(fmtPct(r.shiftedRate))}${cell(fmtPp(r.changePp),ppCls(r.changePp))}${cell(fmtPct(r.periodRate))}${cell(fmtNum(r.periodOrders))}${cell(fmtMoney(r.periodShippingRevenue))}</tr>`).join('');$('detailTable').innerHTML=head+body;document.querySelectorAll('#detailTable th[data-k]').forEach(th=>th.onclick=()=>sortBy(th.dataset.k))}
window.addEventListener('resize',()=>Object.values(charts).forEach(c=>c&&c.resize()));init();
</script>
</body>
</html>
