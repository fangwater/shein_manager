<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>库存成本模板</title>
<style>
:root{--bg:#edf2f3;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d6dee4;--accent:#0f766e;--blue:#2563eb;--warn:#b45309;--bad:#b42318;--focus:#d6f3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}.shell{max-width:1540px;margin:0 auto;padding:18px 20px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.brand h1{font-size:25px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a.active{color:var(--accent);font-weight:800}.layout{display:grid;grid-template-columns:310px minmax(720px,1fr);gap:14px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panel h2{font-size:15px;margin:0}.status,.sub{font-size:12px;color:var(--muted);line-height:1.4}.template-list{display:grid;gap:7px}.template-item{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px;text-align:left;cursor:pointer;color:var(--ink)}.template-item.active{border-color:var(--accent);background:#effaf8;box-shadow:0 0 0 2px var(--focus)}.template-name{font-weight:800;overflow-wrap:anywhere}.new-template{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.inline-input,.inline-select{height:32px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:0 8px;outline:0}.inline-input:focus,.inline-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.template-editor-head{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:8px;align-items:center;margin-bottom:14px}.template-editor-head .inline-input{height:38px;font-weight:850}.actions,.row-actions,.category-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{height:36px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;padding:0 13px;cursor:pointer;white-space:nowrap}.btn.secondary{background:#fff;color:#344054;border:1px solid var(--line)}.btn.danger{background:#fff;color:var(--bad);border:1px solid #f0b7b2}.btn.small{height:30px;padding:0 9px;font-size:12px}.icon-btn{width:31px;height:31px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#344054;font-weight:850;cursor:pointer}.icon-btn.danger{color:var(--bad);border-color:#f0b7b2}.btn:disabled,.icon-btn:disabled{opacity:.52;cursor:not-allowed}.cost-sections{display:grid;gap:14px}.cost-section{border-top:1px solid var(--line);padding-top:13px}.cost-section:first-child{border-top:0}.category-head{display:grid;grid-template-columns:minmax(180px,1fr) 90px auto;gap:8px;align-items:center;margin-bottom:8px}.category-name{font-weight:800}.currency{text-transform:uppercase;text-align:center}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:8px 9px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:middle}th{background:#f8fafb;color:#344054}tr:last-child td{border-bottom:0}.type-name{min-width:180px;width:100%}.mode{min-width:130px}.new-row td{background:#fbfdfd}.new-category{display:grid;grid-template-columns:minmax(180px,1fr) 90px auto;gap:8px;margin-top:14px}.empty{padding:42px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}.toast{position:fixed;right:18px;bottom:18px;max-width:440px;background:#17202a;color:#fff;border-radius:8px;padding:12px 14px;font-size:13px;display:none;z-index:30}.toast.show{display:block}.toast.bad{background:#8f1d17}@media(max-width:1050px){.layout{grid-template-columns:1fr}.category-head{grid-template-columns:1fr 90px}.category-actions{grid-column:1/-1}}@media(max-width:700px){.shell{padding:14px 12px 28px}.top,.panel-head{align-items:flex-start;flex-direction:column}.category-head,.new-category,.template-editor-head{grid-template-columns:1fr}.category-actions{grid-column:auto}.btn{flex:1}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><h1>库存成本模板</h1><p id="shop">加载中...</p></div>
    <div class="nav"><a href="./">PNL</a><a href="logistics">物流分析</a><a href="logistics-costs">物流费用</a><a href="shipping-fee">Shipping Fee</a><a href="returns">退货明细</a><a href="sku-mappings">SKU映射</a><a href="warehouse-relations">关联视图</a><a href="inventory">库存管理</a><a class="active" href="inventory-templates">成本模板</a><a href="logout">退出</a></div>
  </div>
  <div class="layout">
    <aside class="panel">
      <div class="panel-head"><h2>模板</h2><span class="status" id="templateCount"></span></div>
      <div class="template-list" id="templateList"></div>
      <div class="new-template"><input class="inline-input" id="newTemplateName" placeholder="新模板名称"><button class="btn small" id="addTemplateBtn" type="button">创建</button></div>
    </aside>
    <main class="panel">
      <div id="emptyEditor" class="empty">选择一个模板进行管理，或创建新模板</div>
      <div id="editor" hidden>
        <div class="template-editor-head">
          <input class="inline-input" id="templateName" maxlength="120">
          <div class="actions"><button class="btn secondary" id="saveTemplateBtn" type="button">保存名称</button><button class="btn danger" id="deleteTemplateBtn" type="button">删除模板</button></div>
        </div>
        <div class="cost-sections" id="costSections"></div>
        <div class="new-category"><input class="inline-input category-name" id="newCategoryName" placeholder="新增成本分类"><input class="inline-input currency" id="newCategoryCurrency" maxlength="8" value="USD"><button class="btn small" id="addCategoryBtn" type="button">新增分类</button></div>
      </div>
      <div class="status" id="saveStatus" style="margin-top:10px"></div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={templates:[],selectedId:null,shop:''};
function toast(message,bad=false){const el=$('toast');el.textContent=message;el.className='toast show'+(bad?' bad':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.className='toast',3600)}
async function request(url,options={}){const response=await fetch(url,options);const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={detail:text}}if(!response.ok)throw new Error(data.detail||'请求失败');return data}
function selected(){return state.templates.find(t=>Number(t.id)===Number(state.selectedId))||null}
function setTemplates(templates,preferredId=null){state.templates=templates||[];if(preferredId&&state.templates.some(t=>Number(t.id)===Number(preferredId)))state.selectedId=Number(preferredId);else if(!state.templates.some(t=>Number(t.id)===Number(state.selectedId)))state.selectedId=state.templates[0]?.id||null;render()}
function render(){renderList();renderEditor()}
function renderList(){$('templateCount').textContent=`${state.templates.length} 个`;$('templateList').innerHTML=state.templates.length?state.templates.map(t=>`<button class="template-item ${Number(t.id)===Number(state.selectedId)?'active':''}" data-template="${t.id}" type="button"><span class="template-name">${esc(t.name)}</span><span class="sub">${(t.categories||[]).length} 个分类 · 更新 ${esc(t.updatedAt)}</span></button>`).join(''):'<div class="empty">暂无模板</div>';document.querySelectorAll('[data-template]').forEach(btn=>btn.onclick=()=>{state.selectedId=Number(btn.dataset.template);render()})}
function renderEditor(){const template=selected();$('emptyEditor').hidden=!!template;$('editor').hidden=!template;if(!template)return;$('templateName').value=template.name;$('costSections').innerHTML=(template.categories||[]).length?template.categories.map(categoryMarkup).join(''):'<div class="empty">该模板暂无成本分类</div>';bindEditor()}
function categoryMarkup(category,index){const types=(category.types||[]).map((type,typeIndex)=>typeRow(category,type,typeIndex)).join('');return `<section class="cost-section" data-category="${category.id}"><div class="category-head"><input class="inline-input category-name" data-category-name value="${esc(category.name)}"><input class="inline-input currency" data-category-currency maxlength="8" value="${esc(category.currency)}"><div class="category-actions"><button class="btn secondary small" data-save-category="${category.id}" type="button">保存分类</button><button class="icon-btn" data-category-up="${category.id}" type="button" ${index===0?'disabled':''} title="上移">↑</button><button class="icon-btn" data-category-down="${category.id}" type="button" ${index===(selected().categories||[]).length-1?'disabled':''} title="下移">↓</button><button class="icon-btn danger" data-delete-category="${category.id}" type="button" title="删除分类">×</button></div></div><div class="table-wrap"><table><thead><tr><th>成本项</th><th>计算方式</th><th>顺序</th><th></th></tr></thead><tbody>${types}${newTypeRow(category)}</tbody></table></div></section>`}
function typeRow(category,type,index){return `<tr data-type="${type.id}"><td><input class="inline-input type-name" data-type-name value="${esc(type.name)}"></td><td><select class="inline-select mode" data-type-mode><option value="quantity_x_unit" ${type.calculationMode==='quantity_x_unit'?'selected':''}>数量 × 单价</option><option value="direct_amount" ${type.calculationMode==='direct_amount'?'selected':''}>直接金额</option></select></td><td><div class="row-actions"><button class="icon-btn" data-type-up="${type.id}" type="button" ${index===0?'disabled':''}>↑</button><button class="icon-btn" data-type-down="${type.id}" type="button" ${index===(category.types||[]).length-1?'disabled':''}>↓</button></div></td><td><div class="row-actions"><button class="btn secondary small" data-save-type="${type.id}" type="button">保存</button><button class="icon-btn danger" data-delete-type="${type.id}" type="button">×</button></div></td></tr>`}
function newTypeRow(category){return `<tr class="new-row"><td><input class="inline-input type-name" data-new-type-name placeholder="新增成本项"></td><td><select class="inline-select mode" data-new-type-mode><option value="quantity_x_unit">数量 × 单价</option><option value="direct_amount">直接金额</option></select></td><td></td><td><button class="btn small" data-add-type="${category.id}" type="button">新增</button></td></tr>`}
function bindEditor(){document.querySelectorAll('[data-save-category]').forEach(btn=>btn.onclick=()=>saveCategory(Number(btn.dataset.saveCategory)));document.querySelectorAll('[data-delete-category]').forEach(btn=>btn.onclick=()=>deleteCategory(Number(btn.dataset.deleteCategory)));document.querySelectorAll('[data-category-up]').forEach(btn=>btn.onclick=()=>moveCategory(Number(btn.dataset.categoryUp),-1));document.querySelectorAll('[data-category-down]').forEach(btn=>btn.onclick=()=>moveCategory(Number(btn.dataset.categoryDown),1));document.querySelectorAll('[data-save-type]').forEach(btn=>btn.onclick=()=>saveType(Number(btn.dataset.saveType)));document.querySelectorAll('[data-delete-type]').forEach(btn=>btn.onclick=()=>deleteType(Number(btn.dataset.deleteType)));document.querySelectorAll('[data-type-up]').forEach(btn=>btn.onclick=()=>moveType(Number(btn.dataset.typeUp),-1));document.querySelectorAll('[data-type-down]').forEach(btn=>btn.onclick=()=>moveType(Number(btn.dataset.typeDown),1));document.querySelectorAll('[data-add-type]').forEach(btn=>btn.onclick=()=>addType(Number(btn.dataset.addType)))}
async function mutate(url,options,preferredId=state.selectedId){$('saveStatus').textContent='保存中...';try{const data=await request(url,options);setTemplates(data.templates||[],preferredId);return data}catch(error){toast(error.message,true);throw error}finally{$('saveStatus').textContent=''}}
async function createTemplate(){const name=$('newTemplateName').value.trim();if(!name){toast('请填写模板名称',true);return}try{const data=await mutate('api/inventory-cost-templates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})},null);const created=(data.templates||[]).find(t=>t.name===name);setTemplates(data.templates,created?.id);$('newTemplateName').value='';toast('模板已创建')}catch{}}
async function saveTemplate(){const t=selected(),name=$('templateName').value.trim();if(!t||!name)return;try{await mutate(`api/inventory-cost-templates/${t.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})},t.id);toast('模板名称已保存')}catch{}}
async function deleteTemplate(){const t=selected();if(!t||!confirm(`删除模板“${t.name}”？使用该模板的库存单会切换为空模板，所有相关历史成本会永久删除。`))return;try{const data=await mutate(`api/inventory-cost-templates/${t.id}`,{method:'DELETE'},null);state.selectedId=data.templates?.[0]?.id||null;render();toast(`模板已删除，影响 ${data.affectedTickets||0} 张库存单`)}catch{}}
async function addCategory(){const t=selected(),name=$('newCategoryName').value.trim(),currency=$('newCategoryCurrency').value.trim().toUpperCase();if(!t||!name){toast('请填写分类名称',true);return}try{await mutate('api/inventory-cost-categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({templateId:t.id,name,currency})},t.id);$('newCategoryName').value='';toast('分类已新增')}catch{}}
async function saveCategory(id){const section=document.querySelector(`[data-category="${id}"]`),name=section.querySelector('[data-category-name]').value.trim(),currency=section.querySelector('[data-category-currency]').value.trim().toUpperCase();try{await mutate(`api/inventory-cost-categories/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,currency})});toast('分类已保存')}catch{}}
async function deleteCategory(id){const category=selected().categories.find(c=>Number(c.id)===id);if(!category||!confirm(`删除分类“${category.name}”？所有相关历史成本会永久删除。`))return;try{const data=await mutate(`api/inventory-cost-categories/${id}`,{method:'DELETE'});toast(`分类已删除，影响 ${data.affectedTickets||0} 张库存单`)}catch{}}
async function addType(categoryId){const section=document.querySelector(`[data-category="${categoryId}"]`),name=section.querySelector('[data-new-type-name]').value.trim(),calculationMode=section.querySelector('[data-new-type-mode]').value;if(!name){toast('请填写成本项名称',true);return}try{await mutate('api/inventory-cost-types',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({categoryId,name,calculationMode})});toast('成本项已新增')}catch{}}
async function saveType(id){const row=document.querySelector(`[data-type="${id}"]`),name=row.querySelector('[data-type-name]').value.trim(),calculationMode=row.querySelector('[data-type-mode]').value;try{await mutate(`api/inventory-cost-types/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,calculationMode})});toast('成本项已保存')}catch{}}
async function deleteType(id){const type=selected().categories.flatMap(c=>c.types||[]).find(t=>Number(t.id)===id);if(!type||!confirm(`删除成本项“${type.name}”？所有相关历史成本会永久删除。`))return;try{const data=await mutate(`api/inventory-cost-types/${id}`,{method:'DELETE'});toast(`成本项已删除，影响 ${data.affectedTickets||0} 张库存单`)}catch{}}
async function patchSort(url,id,sortOrder){return request(`${url}/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({sortOrder})})}
async function moveCategory(id,direction){const categories=selected().categories||[],index=categories.findIndex(c=>Number(c.id)===id),other=categories[index+direction];if(index<0||!other)return;const current=categories[index];try{await patchSort('api/inventory-cost-categories',current.id,other.sortOrder);const data=await patchSort('api/inventory-cost-categories',other.id,current.sortOrder);setTemplates(data.templates||[],state.selectedId)}catch(error){toast(error.message,true)}}
async function moveType(id,direction){const category=selected().categories.find(c=>(c.types||[]).some(t=>Number(t.id)===id));if(!category)return;const index=category.types.findIndex(t=>Number(t.id)===id),other=category.types[index+direction];if(index<0||!other)return;const current=category.types[index];try{await patchSort('api/inventory-cost-types',current.id,other.sortOrder);const data=await patchSort('api/inventory-cost-types',other.id,current.sortOrder);setTemplates(data.templates||[],state.selectedId)}catch(error){toast(error.message,true)}}
async function load(){try{const data=await request('api/inventory-cost-templates');state.shop=data.shop||'';setTemplates(data.templates||[]);$('shop').textContent='独立维护库存单成本结构'}catch(error){toast(error.message,true)}}
$('addTemplateBtn').onclick=createTemplate;$('saveTemplateBtn').onclick=saveTemplate;$('deleteTemplateBtn').onclick=deleteTemplate;$('addCategoryBtn').onclick=addCategory;$('newTemplateName').addEventListener('keydown',e=>{if(e.key==='Enter')createTemplate()});load();
</script>
</body>
</html>
