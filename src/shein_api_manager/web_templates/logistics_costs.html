<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物流费用</title>
<style>
:root{--bg:#eef3f2;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d6dee4;--accent:#0f766e;--blue:#2563eb;--warn:#b45309;--bad:#b42318;--good:#087443;--soft:#f8fafb;--focus:#d6f3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}.shell{max-width:1760px;margin:0 auto;padding:18px 20px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.brand h1{font-size:25px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a.active{color:var(--accent);font-weight:800}.toolbar{display:grid;grid-template-columns:minmax(300px,1fr) auto auto;gap:9px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800;color:#344054}.field input{height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:0 11px;outline:0}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.btn{height:40px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:850;padding:0 15px;cursor:pointer;white-space:nowrap}.btn.secondary{background:#fff;color:#344054;border:1px solid var(--line)}.btn:disabled{opacity:.58;cursor:wait}.sync-note{grid-column:1/-1;color:var(--muted);font-size:12px;min-height:18px}.layout{display:grid;grid-template-columns:minmax(640px,1.1fr) minmax(440px,.9fr);gap:14px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.panel.detail{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.panel h2{font-size:15px;margin:0}.status,.sub{font-size:12px;color:var(--muted);line-height:1.45}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:720px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f8fafb;color:#344054;z-index:1}tbody tr.selectable{cursor:pointer}tbody tr.selectable:hover td,tbody tr.active td{background:#effaf8}.code{font-weight:850;color:#17202a}.num{text-align:right}.badge{display:inline-flex;align-items:center;min-height:22px;border-radius:999px;padding:2px 8px;background:#e7f3f1;color:var(--accent);font-weight:800}.badge.warn{background:#fff1e7;color:var(--warn)}.badge.bad{background:#fee4e2;color:var(--bad)}.badge.blue{background:#e8f0ff;color:var(--blue)}.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px}.pager button{height:32px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#344054;padding:0 10px;cursor:pointer}.pager button:disabled{opacity:.5}.empty{padding:42px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}.metric{border-left:3px solid var(--accent);background:var(--soft);padding:9px 10px;min-height:64px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:18px;margin-top:5px;overflow-wrap:anywhere}.relation-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}.section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.section h3{font-size:13px;margin:0 0 9px}.cost-block{border-top:2px solid #b8c7cf;padding:11px 0}.cost-block:first-child{border-top:0;padding-top:0}.cost-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}.cost-title{font-weight:850;font-size:13px}.cost-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.money{font-size:18px;font-weight:850;color:var(--good);white-space:nowrap}.mini-table{overflow:auto;border:1px solid var(--line);border-radius:6px}.mini-table table{font-size:11px}.error{color:var(--bad);white-space:normal;max-width:300px}.loading{padding:48px 14px;text-align:center;color:var(--muted)}@media(max-width:1180px){.layout{grid-template-columns:1fr}.panel.detail{position:static;max-height:none}}@media(max-width:720px){.shell{padding:14px 12px 28px}.top,.panel-head,.cost-head{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr}.btn{width:100%}.summary{grid-template-columns:1fr 1fr}.table-wrap{max-height:560px}}
</style></head><body><div class="shell"><div class="top"><div class="brand"><h1>物流费用</h1><p>按 SHEIN 单号查询 XLWMS 资金流水、费用单与费用项目</p></div><div class="nav"><a href="./">PNL</a><a href="logistics">物流分析</a><a class="active" href="logistics-costs">物流费用</a><a href="shipping-fee">Shipping Fee</a><a href="returns">退货明细</a><a href="sku-mappings">SKU映射</a><a href="warehouse-relations">关联视图</a><a href="inventory">库存管理</a><a href="inventory-templates">成本模板</a><a href="logout">退出</a></div></div>
<div class="toolbar"><div class="field"><label>SHEIN 单号</label><input id="search" autocomplete="off" placeholder="输入完整或部分 SHEIN 单号"></div><button class="btn" id="queryBtn" type="button">查询</button><button class="btn secondary" id="syncBtn" type="button">同步最新费用</button><div class="sync-note" id="syncStatus"></div></div>
<div class="layout"><section class="panel"><div class="panel-head"><h2>订单关系</h2><span class="status" id="listStatus">加载中...</span></div><div class="table-wrap"><table><thead><tr><th>SHEIN 单号</th><th>OMS 单号</th><th>仓库</th><th class="num">流水</th><th class="num">费用单</th><th>费用时间</th><th>同步</th></tr></thead><tbody id="orderRows"></tbody></table></div><div class="pager"><button id="prevBtn" type="button">上一页</button><span class="status" id="pageStatus"></span><button id="nextBtn" type="button">下一页</button></div></section><aside class="panel detail"><div class="panel-head"><h2>费用明细</h2><span class="status" id="detailStatus">选择订单查看</span></div><div id="detail"><div class="empty">选择左侧订单，查看一对多费用关系</div></div></aside></div></div>
<script>
const state={page:1,pageSize:50,pages:0,total:0,rows:[],selected:'',syncTimer:null};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=v=>v?String(v).replace('T',' ').replace(/\+00:00$/,' UTC').slice(0,19):'-';
const fmtMoney=(v,c='')=>v===null||v===undefined||v===''?'-':`${esc(c||'')} ${Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`.trim();
async function request(url,options){const r=await fetch(url,options);let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.detail||`请求失败 (${r.status})`);return data}
function syncBadge(r){if(!r.matched)return '<span class="badge warn">未进入 XLWMS</span>';if(Number(r.cost_detail_count)>0)return '<span class="badge">有费用明细</span>';if(r.error_rows)return '<span class="badge bad">同步失败</span>';return r.detail_synced?'<span class="badge warn">无费用单</span>':'<span class="badge blue">待同步</span>'}
function renderRows(){const body=$('orderRows');if(!state.rows.length){body.innerHTML='<tr><td colspan="7"><div class="empty">没有找到订单关系</div></td></tr>';return}body.innerHTML=state.rows.map(r=>`<tr class="selectable ${state.selected===r.platform_order_no?'active':''}" data-order="${esc(r.platform_order_no)}"><td><span class="code">${esc(r.platform_order_no)}</span><span class="sub">${esc(r.shein_order_status_label||r.shein_order_status_normalized||'未知状态')} · ${fmtTime(r.shein_order_created_at)}</span></td><td><span class="code">${esc(r.order_no)}</span></td><td>${esc(r.wh_code)}</td><td class="num">${Number(r.funds_flow_rows||0).toLocaleString()}</td><td class="num">${Number(r.cost_detail_count||0).toLocaleString()}</td><td>${fmtTime(r.last_cost_time)}</td><td>${syncBadge(r)}</td></tr>`).join('');body.querySelectorAll('[data-order]').forEach(row=>row.onclick=()=>loadDetail(row.dataset.order))}
async function loadOrders(reset=false){if(reset)state.page=1;$('listStatus').textContent='加载中...';const qs=new URLSearchParams({search:$('search').value.trim(),page:state.page,pageSize:state.pageSize});try{const data=await request('api/logistics-costs/orders?'+qs);state.rows=data.rows||[];state.total=Number(data.total||0);state.pages=Number(data.pages||0);renderRows();$('listStatus').textContent=`${state.total.toLocaleString()} 个 SHEIN 订单`;$('pageStatus').textContent=`第 ${state.page} / ${Math.max(1,state.pages)} 页`;$('prevBtn').disabled=state.page<=1;$('nextBtn').disabled=state.page>=state.pages;if(state.rows.length){const exact=state.rows.find(r=>r.platform_order_no===$('search').value.trim());loadDetail((exact||state.rows[0]).platform_order_no)}}catch(e){$('listStatus').textContent=e.message;$('orderRows').innerHTML=`<tr><td colspan="7"><div class="empty error">${esc(e.message)}</div></td></tr>`}}
function itemRows(items){if(!items.length)return '<div class="sub">该费用单没有费用项目</div>';return `<div class="mini-table"><table><thead><tr><th>费用项目</th><th class="num">金额</th><th>计费时间</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.bill_item_name||'-')}</td><td class="num">${fmtMoney(i.bill_item_total)}</td><td>${fmtTime(i.charge_time)}</td></tr>`).join('')}</tbody></table></div>`}
function renderDetail(data){const details=data.costDetails||[],flows=data.fundsFlows||[],relations=data.relations||[];const relationHtml=relations.length?relations.map(r=>`<span class="badge blue">${esc(r.wh_code)} · ${esc(r.order_no)}</span>`).join(''):'<span class="badge warn">未找到 OMS 关系</span>';const costs=details.length?details.map(d=>`<div class="cost-block"><div class="cost-head"><div><div class="cost-title">费用单 ${esc(d.cost_no)}</div><div class="cost-meta"><span class="badge blue">${esc(d.wh_code)}</span><span class="badge">OMS ${esc(d.query_order_no)}</span><span class="badge warn">模块 ${esc(d.module_type??'-')}</span></div></div><div class="money">${fmtMoney(d.cost_total,d.currency_code)}</div></div>${itemRows(d.items||[])}</div>`).join(''):'<div class="empty">OMS 关系已存在，但费用明细尚未同步；可点击“同步最新费用”后再查。</div>';const flowRows=flows.length?`<div class="table-wrap"><table><thead><tr><th>仓库</th><th>OMS 单号</th><th>模块</th><th class="num">流水金额</th><th>币种</th><th>费用时间</th><th>明细状态</th></tr></thead><tbody>${flows.map(f=>`<tr><td>${esc(f.wh_code)}</td><td>${esc(f.order_no)}</td><td>${esc(f.module_type??'-')}</td><td class="num">${fmtMoney(f.cost_total)}</td><td>${esc(f.currency_code||'-')}</td><td>${fmtTime(f.cost_time)}</td><td>${esc(f.detail_sync_status||'-')}${f.detail_error_message?`<span class="sub error">${esc(f.detail_error_message)}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="sub">没有资金流水记录</div>';$('detail').innerHTML=`<div class="summary"><div class="metric"><span>SHEIN 单号</span><strong>${esc(data.platformOrderNo)}</strong></div><div class="metric"><span>OMS 关系</span><strong>${relations.length}</strong></div><div class="metric"><span>费用单</span><strong>${details.length}</strong></div></div><div class="relation-list">${relationHtml}</div><div class="section"><h3>费用单与费用项目</h3>${costs}</div><div class="section"><h3>原始资金流水（${flows.length}）</h3>${flowRows}</div>`;$('detailStatus').textContent=`${details.length} 张费用单 · ${details.reduce((n,d)=>n+(d.items||[]).length,0)} 个费用项目`}
async function loadDetail(orderNo){state.selected=orderNo;renderRows();$('detailStatus').textContent='加载中...';$('detail').innerHTML='<div class="loading">正在查询费用关系...</div>';try{renderDetail(await request('api/logistics-costs/detail?'+new URLSearchParams({orderNo})))}catch(e){$('detailStatus').textContent='查询失败';$('detail').innerHTML=`<div class="empty error">${esc(e.message)}</div>`}}
function renderSync(s){const when=s.finishedAt||s.startedAt;let text=s.message||'';if(when)text+=` · ${fmtTime(when)}`;if(s.error)text+=` · ${s.error}`;$('syncStatus').textContent=text;$('syncStatus').classList.toggle('error',Boolean(s.error));$('syncBtn').disabled=Boolean(s.running);$('syncBtn').textContent=s.running?'同步进行中...':'同步最新费用';if(s.running&&!state.syncTimer)state.syncTimer=setInterval(loadSyncStatus,4000);if(!s.running&&state.syncTimer){clearInterval(state.syncTimer);state.syncTimer=null;if(s.phase==='complete')loadOrders(false)}}
async function loadSyncStatus(){try{renderSync(await request('api/logistics-costs/sync'))}catch(e){$('syncStatus').textContent=e.message}}
async function startSync(){if(!confirm('将后台同步全部仓库资金流水，并为每个仓库补最多 500 个费用明细。继续？'))return;$('syncBtn').disabled=true;try{renderSync(await request('api/logistics-costs/sync',{method:'POST'}))}catch(e){$('syncStatus').textContent=e.message;$('syncBtn').disabled=false}}
$('queryBtn').onclick=()=>loadOrders(true);$('search').onkeydown=e=>{if(e.key==='Enter')loadOrders(true)};$('prevBtn').onclick=()=>{if(state.page>1){state.page--;loadOrders()}};$('nextBtn').onclick=()=>{if(state.page<state.pages){state.page++;loadOrders()}};$('syncBtn').onclick=startSync;loadOrders(true);loadSyncStatus();
</script></body></html>
