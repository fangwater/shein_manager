<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}} 登录</title>
<style>:root{--ink:#17202a;--muted:#667085;--line:#d7dde8;--accent:#0f766e;--bg:#eef3f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.panel{width:min(420px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px;box-shadow:0 20px 60px rgba(16,24,40,.12)}h1{margin:0 0 6px;font-size:24px;letter-spacing:0}p{margin:0 0 22px;color:var(--muted);line-height:1.55}.field{margin-top:14px}label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}input{width:100%;height:44px;border:1px solid var(--line);border-radius:6px;padding:0 12px;font-size:16px;outline:0}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #d6f3ee}button{width:100%;height:44px;margin-top:20px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.notice{margin-bottom:14px;color:#b42318;background:#fff1f0;border:1px solid #ffccc7;padding:10px 12px;border-radius:6px}</style>
</head><body><form class="panel" method="post" action="/login"><h1>{{title}}</h1><p>使用账户登录 SHEIN 管理系统。</p><div class="notice">{{message}}</div><div class="field"><label for="username">用户名</label><input id="username" name="username" type="text" autocomplete="username" required autofocus></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button type="submit">登录</button></form><script>const notice=document.querySelector('.notice');notice.style.display=notice.textContent.trim()?'block':'none'</script></body></html>
