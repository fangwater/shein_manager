<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>库存单管理</title>
<style>
:root{--bg:#edf2f3;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d6dee4;--accent:#0f766e;--blue:#2563eb;--bad:#b42318;--focus:#d6f3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}.shell{max-width:1760px;margin:0 auto;padding:18px 20px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.brand h1{font-size:25px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a.active{color:var(--accent);font-weight:800}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 14px;min-height:86px}.card .k{font-size:12px;color:var(--muted);font-weight:750}.card .v{font-size:23px;font-weight:850;margin-top:8px;overflow-wrap:anywhere}.card .s{font-size:12px;color:var(--muted);margin-top:4px}.layout{display:grid;grid-template-columns:minmax(760px,1.35fr) minmax(340px,.65fr);gap:14px;align-items:start;margin-bottom:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.panel h2{font-size:15px;margin:0}.status,.sub{font-size:12px;color:var(--muted);line-height:1.4}.ticket-fields{display:grid;grid-template-columns:minmax(190px,.7fr) minmax(190px,.7fr) minmax(280px,1.2fr);gap:10px;margin-bottom:12px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:750;color:#344054}.field input,.field textarea,.field select,.inline-input{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);outline:0}.field input,.field select{height:38px;padding:0 10px}.field textarea{height:38px;min-height:38px;padding:8px 10px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus,.inline-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.actions,.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{height:36px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;padding:0 13px;cursor:pointer;white-space:nowrap}.btn.secondary{background:#fff;color:#344054;border:1px solid var(--line)}.btn.danger{background:#fff;color:var(--bad);border:1px solid #f0b7b2}.btn.small{height:30px;padding:0 9px;font-size:12px}.btn:disabled{opacity:.58;cursor:wait}.icon-btn{width:31px;height:31px;border:1px solid #f0b7b2;border-radius:6px;background:#fff;color:var(--bad);font-weight:850;cursor:pointer}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:17px 0 8px}.section-title h3{font-size:13px;margin:0;color:#344054}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:8px 9px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:middle}th{background:#f8fafb;color:#344054;font-weight:800}tr:last-child td{border-bottom:0}.num{text-align:right}.inline-input{height:31px;padding:0 7px}.sku-input{min-width:180px;width:100%}.qty-input{width:82px;text-align:right}.money-input{width:96px;text-align:right}.note-input{min-width:160px;width:100%}.cost-sections{display:grid;gap:12px}.cost-section{border-top:1px solid var(--line);padding-top:12px}.cost-section:first-child{border-top:0}.cost-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.cost-head h4{font-size:13px;margin:0}.badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;background:#e7f3f1;color:var(--accent);font-weight:800}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:#fff}.ref-tools{display:grid;gap:8px;margin-bottom:10px}.ref-tools input,.search-tools input{height:36px;border:1px solid var(--line);border-radius:6px;padding:0 10px;outline:0}.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;max-height:640px;overflow:auto}.ref-card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;display:grid;gap:5px;text-align:left;cursor:pointer;color:var(--ink)}.ref-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.thumb{width:100%;height:112px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#f3f4f6}.thumb.placeholder{display:grid;place-items:center;color:#98a2b3;font-size:12px;font-weight:850}.sku{font-weight:850;overflow-wrap:anywhere}.list-panel{margin-top:14px}.list-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.search-tools{display:flex;gap:8px;align-items:center}.search-tools input{min-width:300px}.ticket-row{cursor:pointer}.ticket-row:hover td{background:#fbfdfd}.toast{position:fixed;right:18px;bottom:18px;max-width:440px;background:#17202a;color:#fff;border-radius:8px;padding:12px 14px;font-size:13px;display:none;z-index:30}.toast.show{display:block}.toast.bad{background:#8f1d17}@media(max-width:1260px){.layout{grid-template-columns:1fr}.ticket-fields{grid-template-columns:1fr 1fr}.ticket-fields .field:last-child{grid-column:1/-1}.ref-grid{max-height:420px}}@media(max-width:760px){.shell{padding:14px 12px 28px}.top,.panel-head,.list-toolbar{align-items:flex-start;flex-direction:column}.ticket-fields{grid-template-columns:1fr}.ticket-fields .field:last-child{grid-column:auto}.cards{grid-template-columns:1fr 1fr}.search-tools{width:100%}.search-tools input{min-width:0;flex:1}.btn{flex:1}.ref-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><h1>库存单管理</h1><p id="shop">加载中...</p></div>
    <div class="nav"><a href="./">PNL</a><a href="logistics">物流分析</a><a href="shipping-fee">Shipping Fee</a><a href="returns">退货明细</a><a href="sku-mappings">SKU映射</a><a href="warehouse-relations">关联视图</a><a class="active" href="inventory">库存管理</a><a href="inventory-templates">成本模板</a><a href="logout">退出</a></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="layout">
    <div class="panel">
      <div class="panel-head"><h2>库存单</h2><span class="status" id="editStatus">新建库存单</span></div>
      <div class="ticket-fields">
        <div class="field"><label>库存单号</label><input id="ticketNo" maxlength="120" placeholder="唯一库存单号"></div>
        <div class="field"><label>成本模板</label><select id="costTemplate"></select></div>
        <div class="field"><label>备注</label><textarea id="ticketNote" maxlength="1000" placeholder="库存单备注"></textarea></div>
      </div>
      <div class="actions"><button class="btn" id="saveBtn" type="button">保存库存单</button><button class="btn secondary" id="newBtn" type="button">新建</button><button class="btn danger" id="deleteTicketBtn" type="button" hidden>删除库存单</button><a class="btn secondary" href="inventory-templates">管理模板</a><span class="status" id="saveStatus"></span></div>
      <div class="section-title"><h3>SKU 明细</h3><button class="btn secondary small" id="addLineBtn" type="button">+ SKU 行</button></div>
      <div class="table-wrap"><table><thead><tr><th>仓库 SKU</th><th class="num">数量</th><th class="num">单价</th><th class="num">金额</th><th>备注</th><th></th></tr></thead><tbody id="lineRows"></tbody></table></div>
      <div class="section-title"><h3>成本明细</h3><span class="status" id="costStatus"></span></div>
      <div class="cost-sections" id="costSections"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>仓库 SKU 参考</h2><span class="status" id="refStatus"></span></div>
      <div class="ref-tools"><input id="refSearch" placeholder="搜索仓库 SKU、SHEIN SKU 或商品"></div>
      <div class="ref-grid" id="refGrid"></div>
    </div>
  </div>
  <div class="panel list-panel">
    <div class="list-toolbar"><div><h2>库存单列表</h2><span class="status" id="tableStatus"></span></div><div class="search-tools"><input id="search" placeholder="搜索库存单号、仓库 SKU 或备注"><button class="btn secondary" id="searchBtn" type="button">查询</button></div></div>
    <div class="table-wrap"><table id="ticketTable"></table></div>
  </div>
</div>
<datalist id="warehouseSkuOptions"></datalist><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={tickets:[],templates:[],warehouseRefs:[],summary:{},current:null,lines:[],costDrafts:{},selectedTemplateId:null};
let lineKey=0;
const has=v=>v!==null&&v!==undefined&&String(v)!=='';
const optional=v=>{const s=String(v??'').trim();return s===''?null:Number(s)};
const money=(v,c='')=>Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+(c?' '+c:'');
const num=v=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:3});
function toast(message,bad=false){const el=$('toast');el.textContent=message;el.className='toast show'+(bad?' bad':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.className='toast',3600)}
async function request(url,options={}){const response=await fetch(url,options);const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={detail:text}}if(!response.ok)throw new Error(data.detail||'请求失败');return data}
function emptyLine(){return {uiKey:++lineKey,warehouseSku:'',quantity:'',unitPrice:'',amount:'',note:''}}
function selectedTemplate(){return state.templates.find(t=>Number(t.id)===Number(state.selectedTemplateId))||null}
function allTypes(){return (selectedTemplate()?.categories||[]).flatMap(c=>c.types||[])}
function costDraft(typeId){return state.costDrafts[typeId]||{costTypeId:typeId,quantity:'',unitPrice:'',amount:'',note:''}}
function renderCards(){const s=state.summary||{};const base=[['库存单',num(s.tickets),'已保存库存单'],['SKU 行',num(s.lines),'库存单商品明细'],['仓库 SKU',num(s.warehouseSkus),'可选仓库 SKU'],['数量合计',num(s.quantity),'全部库存数量'],['库存金额',money(s.inventoryAmount),'SKU 明细金额']];const costs=Object.entries(s.costTotals||{}).sort().map(([c,v])=>[c+' 成本',money(v,c),'库存单公共成本']);$('cards').innerHTML=[...base,...costs].map(c=>`<div class="card"><div class="k">${esc(c[0])}</div><div class="v">${esc(c[1])}</div><div class="s">${esc(c[2])}</div></div>`).join('')}
function renderTemplateSelect(){$('costTemplate').innerHTML='<option value="">空模板</option>'+state.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');$('costTemplate').value=state.selectedTemplateId??''}
function renderWarehouseOptions(){$('warehouseSkuOptions').innerHTML=state.warehouseRefs.map(r=>`<option value="${esc(r.warehouseSku)}"></option>`).join('')}
function renderLines(){if(!state.lines.length)state.lines=[emptyLine()];$('lineRows').innerHTML=state.lines.map((line,index)=>`<tr data-line="${index}"><td><input class="inline-input sku-input" list="warehouseSkuOptions" data-line-field="warehouseSku" value="${esc(line.warehouseSku)}"></td><td class="num"><input class="inline-input qty-input" type="number" min="0" step="0.001" data-line-field="quantity" value="${esc(line.quantity)}"></td><td class="num"><input class="inline-input money-input" type="number" min="0" step="0.01" data-line-field="unitPrice" value="${esc(line.unitPrice)}"></td><td class="num"><input class="inline-input money-input" type="number" min="0" step="0.01" data-line-field="amount" value="${esc(line.amount)}"></td><td><input class="inline-input note-input" data-line-field="note" value="${esc(line.note)}"></td><td><button class="icon-btn" type="button" data-remove-line="${index}">×</button></td></tr>`).join('');document.querySelectorAll('[data-line-field]').forEach(input=>input.addEventListener('input',()=>updateLine(input)));document.querySelectorAll('[data-remove-line]').forEach(btn=>btn.onclick=()=>{state.lines.splice(Number(btn.dataset.removeLine),1);renderLines()})}
function updateLine(input){const row=input.closest('tr'),index=Number(row.dataset.line),field=input.dataset.lineField;state.lines[index][field]=input.value;if(field==='quantity'||field==='unitPrice'){const q=optional(state.lines[index].quantity),p=optional(state.lines[index].unitPrice),amount=q!==null&&p!==null?(q*p).toFixed(2):'';state.lines[index].amount=amount;row.querySelector('[data-line-field="amount"]').value=amount}}
function renderCosts(){const template=selectedTemplate();if(!template){$('costStatus').textContent='空模板';$('costSections').innerHTML='<div class="empty">当前库存单不录入公共成本</div>';return}const categories=template.categories||[];$('costStatus').textContent=template.name;$('costSections').innerHTML=categories.length?categories.map(categoryMarkup).join(''):'<div class="empty">该模板暂无成本项</div>';document.querySelectorAll('[data-cost-field]').forEach(input=>input.addEventListener('input',()=>updateCost(input)))}
function categoryMarkup(category){const rows=(category.types||[]).map(type=>costRow(type)).join('');return `<section class="cost-section"><div class="cost-head"><h4>${esc(category.name)}</h4><span class="badge">${esc(category.currency)}</span></div><div class="table-wrap"><table><thead><tr><th>成本项</th><th class="num">数量</th><th class="num">单价</th><th class="num">金额</th><th>备注</th></tr></thead><tbody>${rows||'<tr><td colspan="5"><span class="sub">暂无成本项</span></td></tr>'}</tbody></table></div></section>`}
function costRow(type){const d=costDraft(type.id),qty=type.calculationMode==='quantity_x_unit';return `<tr data-cost-type="${type.id}"><td><span class="sku">${esc(type.name)}</span><span class="sub">${qty?'数量 × 单价':'直接金额'}</span></td><td class="num">${qty?`<input class="inline-input qty-input" type="number" min="0" step="0.001" data-cost-field="quantity" value="${esc(d.quantity)}">`:'-'}</td><td class="num">${qty?`<input class="inline-input money-input" type="number" min="0" step="0.01" data-cost-field="unitPrice" value="${esc(d.unitPrice)}">`:'-'}</td><td class="num"><input class="inline-input money-input" type="number" min="0" step="0.01" data-cost-field="amount" value="${esc(d.amount)}" ${qty?'readonly':''}></td><td><input class="inline-input note-input" data-cost-field="note" value="${esc(d.note)}"></td></tr>`}
function updateCost(input){const row=input.closest('tr'),typeId=Number(row.dataset.costType),field=input.dataset.costField,d={...costDraft(typeId),[field]:input.value};const type=allTypes().find(x=>Number(x.id)===typeId);if(type?.calculationMode==='quantity_x_unit'&&(field==='quantity'||field==='unitPrice')){const q=optional(d.quantity),p=optional(d.unitPrice);d.amount=q!==null&&p!==null?(q*p).toFixed(2):'';row.querySelector('[data-cost-field="amount"]').value=d.amount}state.costDrafts[typeId]=d}
function setTicket(ticket=null){state.current=ticket;state.selectedTemplateId=ticket?.costTemplateId??null;state.lines=(ticket?.lines||[]).map(line=>({...line,uiKey:++lineKey,quantity:line.quantity??'',unitPrice:line.unitPrice??'',amount:line.amount??''}));if(!state.lines.length)state.lines=[emptyLine()];state.costDrafts={};(ticket?.costs||[]).forEach(cost=>state.costDrafts[cost.costTypeId]={...cost,quantity:cost.quantity??'',unitPrice:cost.unitPrice??'',amount:cost.amount??'',note:cost.note||''});$('ticketNo').value=ticket?.ticketNo||'';$('ticketNote').value=ticket?.note||'';$('editStatus').textContent=ticket?`编辑 ${ticket.ticketNo} · ${ticket.costTemplateName||'空模板'}`:'新建库存单';$('deleteTicketBtn').hidden=!ticket;renderTemplateSelect();renderLines();renderCosts();window.scrollTo({top:0,behavior:'smooth'})}
function collectPayload(){const lines=state.lines.filter(line=>String(line.warehouseSku||'').trim()||String(line.note||'').trim()||has(line.unitPrice)||has(line.amount)||has(line.quantity)).map(line=>({warehouseSku:String(line.warehouseSku||'').trim(),quantity:line.quantity,unitPrice:line.unitPrice,amount:line.amount,note:line.note}));const costs=Object.values(state.costDrafts).filter(d=>allTypes().some(t=>Number(t.id)===Number(d.costTypeId))).map(d=>({costTypeId:d.costTypeId,quantity:d.quantity,unitPrice:d.unitPrice,amount:d.amount,note:d.note}));return {ticketNo:$('ticketNo').value.trim(),costTemplateId:state.selectedTemplateId,note:$('ticketNote').value,lines,costs}}
async function saveTicket(){const payload=collectPayload();if(!payload.ticketNo){toast('请填写库存单号',true);return}if(!payload.lines.length||payload.lines.some(line=>!line.warehouseSku)){toast('请至少填写一条完整 SKU 明细',true);return}const btn=$('saveBtn');btn.disabled=true;try{const url=state.current?`api/inventory/${state.current.ticketId}`:'api/inventory';const data=await request(url,{method:state.current?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});setTicket(data.ticket);await loadOverview();toast('库存单已保存')}catch(error){toast(error.message,true)}finally{btn.disabled=false}}
async function editTicket(id){try{const data=await request(`api/inventory/${id}`);state.templates=data.templates||state.templates;setTicket(data.ticket)}catch(error){toast(error.message,true)}}
async function deleteTicket(){if(!state.current||!confirm(`删除库存单 ${state.current.ticketNo}？`))return;try{await request(`api/inventory/${state.current.ticketId}`,{method:'DELETE'});setTicket(null);await loadOverview();toast('库存单已删除')}catch(error){toast(error.message,true)}}
function renderTicketTable(){const rows=state.tickets||[];$('tableStatus').textContent=`${rows.length} 张库存单`;if(!rows.length){$('ticketTable').innerHTML='<tr><td><div class="empty">暂无库存单</div></td></tr>';return}const currencies=[...new Set(rows.flatMap(r=>Object.keys(r.costTotals||{})))].sort();const head=`<thead><tr><th>库存单号</th><th>成本模板</th><th>更新时间</th><th class="num">SKU 行</th><th class="num">数量</th>${currencies.map(c=>`<th class="num">${esc(c)} 成本</th>`).join('')}<th>备注</th><th></th></tr></thead>`;const body=rows.map(r=>`<tr class="ticket-row" data-ticket-id="${r.ticketId}"><td><span class="sku">${esc(r.ticketNo)}</span></td><td><span class="badge">${esc(r.costTemplateName||'空模板')}</span></td><td><span class="sub">${esc(r.updatedAt)}</span></td><td class="num">${num(r.lineCount)}</td><td class="num">${num(r.quantity)}</td>${currencies.map(c=>`<td class="num">${money(r.costTotals?.[c]||0,c)}</td>`).join('')}<td><span class="sub">${esc(r.note||'')}</span></td><td><button class="btn secondary small" data-edit-ticket="${r.ticketId}" type="button">编辑</button></td></tr>`).join('');$('ticketTable').innerHTML=head+`<tbody>${body}</tbody>`;document.querySelectorAll('[data-edit-ticket]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();editTicket(Number(btn.dataset.editTicket))});document.querySelectorAll('.ticket-row').forEach(row=>row.onclick=()=>editTicket(Number(row.dataset.ticketId)))}
function image(url){return url?`<img class="thumb" src="${esc(url)}" alt="" loading="lazy">`:'<div class="thumb placeholder">SKU</div>'}
function filteredRefs(){const q=$('refSearch').value.trim().toLowerCase();return state.warehouseRefs.filter(r=>!q||`${r.warehouseSku} ${(r.items||[]).map(i=>`${i.sheinSku} ${i.title}`).join(' ')}`.toLowerCase().includes(q))}
function renderRefs(){const refs=filteredRefs();$('refStatus').textContent=`${refs.length} 个仓库 SKU`;const cards=[];refs.forEach(ref=>{const items=(ref.items||[]).length?ref.items:[{}];items.slice(0,3).forEach(item=>cards.push(`<button class="ref-card" type="button" data-add-wh="${esc(ref.warehouseSku)}">${image(item.imageUrl)}<span class="sku">${esc(ref.warehouseSku)}</span>${item.sheinSku?`<span class="sub">${esc(item.sheinSku)}</span>`:''}<span class="sub">${esc(item.title||'')}</span></button>`))});$('refGrid').innerHTML=cards.length?cards.join(''):'<div class="empty">没有匹配的仓库 SKU</div>';document.querySelectorAll('[data-add-wh]').forEach(btn=>btn.onclick=()=>{if(state.lines.some(l=>l.warehouseSku===btn.dataset.addWh)){toast('该仓库 SKU 已存在');return}const target=state.lines.find(l=>!l.warehouseSku);if(target)target.warehouseSku=btn.dataset.addWh;else state.lines.push({...emptyLine(),warehouseSku:btn.dataset.addWh});renderLines()})}
async function loadOverview(){const qs=new URLSearchParams();if($('search').value.trim())qs.set('q',$('search').value.trim());const data=await request('api/inventory?'+qs.toString());state.tickets=data.tickets||[];state.templates=data.templates||[];state.summary=data.summary||{};state.warehouseRefs=data.warehouseRefs||[];$('shop').textContent=`${data.shop} · 库存单`;renderCards();renderWarehouseOptions();renderTicketTable();renderRefs();renderTemplateSelect();renderCosts()}
$('costTemplate').onchange=()=>{const next=$('costTemplate').value?Number($('costTemplate').value):null;if(Object.values(state.costDrafts).some(d=>has(d.amount)||has(d.quantity)||has(d.unitPrice)||String(d.note||'').trim())&&!confirm('切换模板会清空当前未保存的成本输入，继续？')){$('costTemplate').value=state.selectedTemplateId??'';return}state.selectedTemplateId=next;state.costDrafts={};renderCosts()};$('saveBtn').onclick=saveTicket;$('newBtn').onclick=()=>setTicket(null);$('deleteTicketBtn').onclick=deleteTicket;$('addLineBtn').onclick=()=>{state.lines.push(emptyLine());renderLines()};$('searchBtn').onclick=()=>loadOverview().catch(e=>toast(e.message,true));$('refSearch').oninput=renderRefs;loadOverview().then(()=>setTicket(null)).catch(e=>toast(e.message,true));
</script>
</body>
</html>
