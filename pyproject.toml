[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shein-api-manager"
version = "0.1.0"
description = "SHEIN authorization and order API manager"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41.0.0",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
shein-manager = "shein_api_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
