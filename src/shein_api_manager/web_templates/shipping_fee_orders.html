<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shipping Fee 未达成订单</title>
<style>
:root{--bg:#eef3f2;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d6dee4;--accent:#0f766e;--bad:#b42318;--good:#087443;--warn:#b45309;--focus:#d6f3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}.shell{max-width:1760px;margin:0 auto;padding:18px 20px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.brand h1{font-size:24px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a.active{color:var(--accent);font-weight:800}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 14px;min-height:86px}.card .k{font-size:12px;color:var(--muted);font-weight:750}.card .v{font-size:22px;font-weight:850;margin-top:8px}.card .s{font-size:12px;color:var(--muted);margin-top:4px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.panel h2{font-size:15px;margin:0}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tools input{height:36px;min-width:320px;border:1px solid var(--line);border-radius:6px;padding:0 10px;outline:0}.tools input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.btn{height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#344054;font-weight:750;padding:0 11px;cursor:pointer}.btn:hover{border-color:var(--accent);color:var(--accent)}.status,.sub{font-size:12px;color:var(--muted);line-height:1.4}.table-wrap{overflow:auto;max-height:calc(100vh - 270px);border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:right;vertical-align:middle}th{position:sticky;top:0;background:#f8fafb;color:#344054;z-index:3}th:nth-child(2),td:nth-child(2){text-align:left}.toggle{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#344054;cursor:pointer;font-size:14px}.toggle:hover{border-color:var(--accent);color:var(--accent)}.order-no{font-weight:850}.badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;background:#e7f3f1;color:var(--accent);font-weight:800}.badge.bad{background:#fee4e2;color:var(--bad)}.badge.warn{background:#fef0c7;color:var(--warn)}.child-row[hidden]{display:none}.child-row>td{padding:0;background:#f8fafb}.child-wrap{padding:10px 12px 14px 48px}.child-table{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden}.child-table th{position:static;background:#f3f6f8;font-size:11px}.child-table th,.child-table td{padding:8px 9px}.child-table th:first-child,.child-table td:first-child{text-align:left}.child-table tr.target-miss td{background:#fff5f4}.product{display:grid;gap:3px;max-width:280px;white-space:normal}.product strong{font-size:12px}.code{font-weight:800;overflow-wrap:anywhere}.profit.pos{color:var(--good);font-weight:850}.profit.neg{color:var(--bad);font-weight:850}.empty{padding:48px;text-align:center;color:var(--muted)}@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.shell{padding:14px 12px 28px}.top,.panel-head{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr 1fr}.tools{width:100%}.tools input{min-width:0;width:100%}.child-wrap{padding-left:10px}.table-wrap{max-height:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="brand"><h1>Shipping Fee 未达成订单</h1><p id="context">加载中...</p></div><div class="nav"><a href="../">PNL</a><a class="active" href="../shipping-fee">Shipping Fee</a><a href="../logistics">物流分析</a><a href="../logout">退出</a></div></div>
  <div class="cards" id="cards"></div>
  <div class="panel">
    <div class="panel-head"><div><h2>订单拆分明细</h2><span class="status" id="tableStatus"></span></div><div class="tools"><input id="search" placeholder="搜索订单号、SKC、平台 SKU 或仓库 SKU"><button class="btn" id="expandAll" type="button">全部展开</button><button class="btn" id="collapseAll" type="button">全部收起</button></div></div>
    <div class="table-wrap"><table id="ordersTable"></table></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const money=v=>'$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const num=v=>Number(v||0).toLocaleString();const pct=v=>v===null||v===undefined?'-':(Number(v)*100).toFixed(2)+'%';const date=v=>String(v||'').replace('T',' ').slice(0,19);let state={orders:[],summary:{},expanded:new Set()};
function price(v,c){const value=Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});return c==='USD'?'$'+value:value+' '+esc(c||'')}
function renderCards(){const s=state.summary||{},currency=s.currency||'USD';const cards=[['未达成订单',num(s.orders),'所选仓库 SKU'],['目标未达成项',num(s.targetMissItems),'所选仓库 SKU'],['订单商品总额',price(s.productTotalPrice,currency),'productTotalPrice'],['订单服务费',price(s.serviceCharge,currency),'totalServiceCharge'],['PNL 总收入',money(s.revenueUsd),'Gross Revenue'],['订单总履约费',money(s.fulfillmentFeeUsd),'PNL 拆分汇总'],['商品成本',money(s.productCostUsd),'PNL 成本'],['包装费',money(s.packagingFeeUsd),'PNL 成本'],['订单利润',money(s.profitUsd),`利润率 ${pct(s.profitMargin)}`],['订单 Shipping Fee',money(s.shippingFeeUsd),'PNL 拆分汇总']];$('cards').innerHTML=cards.map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${c[2]}</div></div>`).join('')}
function itemMatches(item,q){return `${item.platformSkc} ${item.skcName} ${item.platformSku} ${item.warehouseSku} ${item.title} ${item.attribute}`.toLowerCase().includes(q)}
function filteredOrders(){const q=$('search').value.trim().toLowerCase();return q?state.orders.filter(order=>String(order.orderNo).toLowerCase().includes(q)||(order.items||[]).some(item=>itemMatches(item,q))):state.orders}
function itemRows(items){return items.map(item=>{const profitClass=Number(item.profitUsd||0)>=0?'pos':'neg';return `<tr class="${item.unachievedTarget?'target-miss':''}"><td><div class="product"><strong>${esc(item.title||item.attribute||'-')}</strong><span class="sub">${esc(item.attribute||'')}</span>${item.unachievedTarget?'<span class="badge bad">目标未达成</span>':item.selectedWarehouseSku?'<span class="badge">目标 SKU</span>':''}</div></td><td><span class="code">${esc(item.platformSkc||'-')}</span>${item.skcName&&item.skcName!==item.platformSkc?`<span class="sub">${esc(item.skcName)}</span>`:''}</td><td><span class="code">${esc(item.platformSku||'-')}</span></td><td><span class="code">${esc(item.warehouseSku||'-')}</span></td><td>${price(item.price,item.currency)}</td><td>${pct(item.allocationRatio)}<span class="sub">${esc(item.allocationMethod||'-')}</span></td><td>${money(item.revenueAllocatedUsd)}</td><td>${money(item.fulfillmentFeeAllocatedUsd)}</td><td>${money(item.productCostUsd)}</td><td>${money(item.packagingFeeUsd)}</td><td class="profit ${profitClass}">${money(item.profitUsd)}<span class="sub">${pct(item.profitMargin)}</span></td><td>${money(item.shippingFeeAllocatedUsd)}</td></tr>`}).join('')}
function childTable(order){return `<div class="child-wrap"><table class="child-table"><thead><tr><th>商品</th><th>平台 SKC</th><th>平台 SKU</th><th>仓库 SKU</th><th>价格</th><th>拆分</th><th>PNL 收入拆分</th><th>履约费拆分</th><th>商品成本</th><th>包装费</th><th>利润拆分</th><th>Shipping Fee 拆分</th></tr></thead><tbody>${itemRows(order.items||[])}</tbody></table></div>`}
function renderOrders(){const orders=filteredOrders();$('tableStatus').textContent=`${orders.length} 个订单` ;if(!orders.length){$('ordersTable').innerHTML='<tr><td><div class="empty">该区间没有未达成订单</div></td></tr>';return}const head='<thead><tr><th></th><th>订单号</th><th>创建时间</th><th>状态</th><th>订单商品总额</th><th>订单服务费</th><th>PNL 总收入</th><th>订单总履约费</th><th>订单利润</th><th>利润率</th><th>订单 Shipping Fee</th><th>商品数</th><th>目标未达成</th></tr></thead>';const body=orders.map(order=>{const open=state.expanded.has(order.orderNo);return `<tbody><tr><td><button class="toggle" type="button" data-toggle="${esc(order.orderNo)}" title="${open?'收起':'展开'}">${open?'▾':'▸'}</button></td><td><span class="order-no">${esc(order.orderNo)}</span></td><td>${esc(date(order.orderCreatedAt))}</td><td><span class="badge">${esc(order.orderStatus||'-')}</span></td><td>${price(order.orderProductTotalPrice,order.orderCurrency)}</td><td>${price(order.orderServiceCharge,order.orderCurrency)}</td><td>${money(order.orderRevenueUsd)}</td><td>${money(order.orderFulfillmentFeeUsd)}</td><td class="profit ${Number(order.orderProfitUsd||0)>=0?'pos':'neg'}">${money(order.orderProfitUsd)}</td><td>${pct(order.orderProfitMargin)}</td><td>${money(order.orderShippingFeeUsd)}</td><td>${num(order.skuCount)}</td><td><span class="badge bad">${num(order.targetMissItems)}</span></td></tr><tr class="child-row" ${open?'':'hidden'}><td colspan="13">${childTable(order)}</td></tr></tbody>`}).join('');$('ordersTable').innerHTML=head+body;document.querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=()=>{const key=btn.dataset.toggle;state.expanded.has(key)?state.expanded.delete(key):state.expanded.add(key);renderOrders()})}
async function init(){const qs=new URLSearchParams(location.search),warehouseSku=qs.get('warehouseSku')||'',start=qs.get('start')||'',end=qs.get('end')||'';if(!warehouseSku){$('context').textContent='缺少仓库 SKU';renderOrders();return}const api=new URLSearchParams({warehouseSku});if(start)api.set('start',start);if(end)api.set('end',end);const response=await fetch('/api/shipping-fee/unachieved-orders?'+api.toString());if(!response.ok){if(response.status===401){location.href='../shipping-fee';return}$('context').textContent='加载失败：'+await response.text();return}const data=await response.json();state.orders=data.orders||[];state.summary=data.summary||{};$('context').textContent=`${data.warehouseSku} · ${data.startDate} 至 ${data.endDate}`;renderCards();renderOrders()}
$('search').oninput=renderOrders;$('expandAll').onclick=()=>{state.expanded=new Set(filteredOrders().map(order=>order.orderNo));renderOrders()};$('collapseAll').onclick=()=>{state.expanded.clear();renderOrders()};init();
</script>
</body>
</html>
