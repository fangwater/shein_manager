<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHEIN 库存管理</title>
<style>
:root{--bg:#eef3f2;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d6dee4;--accent:#0f766e;--blue:#2563eb;--warn:#b45309;--bad:#b42318;--good:#087443;--soft:#f8fafb;--focus:#d6f3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,textarea{font:inherit}.shell{max-width:1720px;margin:0 auto;padding:18px 20px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.brand h1{font-size:25px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a.active{color:var(--accent);font-weight:800}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 14px;min-height:86px}.card .k{font-size:12px;color:var(--muted);font-weight:750}.card .v{font-size:23px;font-weight:850;margin-top:8px}.card .s{font-size:12px;color:var(--muted);margin-top:4px}.layout{display:grid;grid-template-columns:minmax(680px,1.2fr) minmax(360px,.8fr);gap:14px;align-items:start;margin-bottom:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.panel h2{font-size:15px;margin:0}.status,.hint{font-size:12px;color:var(--muted);line-height:1.45}.form-grid{display:grid;grid-template-columns:1.1fr 1.1fr 100px 110px 110px;gap:10px;align-items:end;margin-bottom:10px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:750;color:#344054}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);outline:0}.field input{height:38px;padding:0 10px}.field textarea{min-height:38px;padding:9px 10px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 2px}.btn{height:36px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:850;padding:0 13px;cursor:pointer}.btn.secondary{background:#fff;color:#344054;border:1px solid var(--line)}.btn:disabled{opacity:.62;cursor:wait}.fee-sections{display:grid;gap:12px;margin-top:14px}.fee-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.fee-title h3{font-size:13px;margin:0;color:#344054}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:8px 9px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#f8fafb;color:#344054;z-index:1}.num{text-align:right}.fee-input{width:96px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 7px;text-align:right}.fee-note{width:100%;min-width:180px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px}.fee-input:focus,.fee-note:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus);outline:0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;min-width:280px;background:#fff}.ref-tools{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;max-height:660px;overflow:auto;padding-right:2px}.ref-card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;display:grid;gap:6px;text-align:left;cursor:pointer;color:var(--ink)}.ref-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.thumb{width:100%;height:118px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#f3f4f6}.thumb.small{width:36px;height:46px}.thumb.placeholder{display:grid;place-items:center;color:#98a2b3;font-size:12px;font-weight:850}.sku{font-weight:850;color:#17202a;overflow-wrap:anywhere}.sub{display:block;margin-top:3px;color:var(--muted);font-size:12px;white-space:normal;line-height:1.35}.badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;background:#e7f3f1;color:#0f766e;font-weight:800}.badge.blue{background:#e8f0ff;color:#2563eb}.badge.warn{background:#fff1e7;color:#b45309}.record-product{display:flex;align-items:center;gap:6px}.record-product .thumb{flex:0 0 auto}.record-row{cursor:pointer}.record-row:hover td{background:#fbfdfd}.empty{padding:42px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:#fff}.toast{position:fixed;right:18px;bottom:18px;max-width:420px;background:#17202a;color:#fff;border-radius:8px;padding:12px 14px;font-size:13px;box-shadow:0 10px 30px rgba(16,24,40,.18);display:none;z-index:30}.toast.show{display:block}.toast.bad{background:#8f1d17}@media(max-width:1260px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr 1fr}}@media(max-width:720px){.shell{padding:14px 12px 28px}.top,.panel-head{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.toolbar input{min-width:0;width:100%}.btn{flex:1}.ref-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="brand"><h1>SHEIN 库存管理</h1><p id="shop">加载中...</p></div><div class="nav"><a href="./">PNL</a><a href="logistics">物流分析</a><a href="shipping-fee">Shipping Fee</a><a href="returns">退货明细</a><a href="sku-mappings">SKU映射</a><a href="warehouse-relations">关联视图</a><a class="active" href="inventory">库存管理</a><a href="logout">退出</a></div></div>
  <div class="cards" id="cards"></div>
  <div class="layout">
    <section class="panel">
      <div class="panel-head"><h2>库存记录 / 订单费用</h2><span class="status" id="editStatus">新建记录</span></div>
      <div class="form-grid">
        <div class="field"><label>订单号</label><input id="orderNo" autocomplete="off" placeholder="输入订单号"></div>
        <div class="field"><label>仓库 SKU</label><input id="warehouseSku" list="warehouseList" autocomplete="off" placeholder="输入或选择仓库 SKU"></div>
        <div class="field"><label>数量</label><input id="quantity" type="number" min="0" step="0.001" inputmode="decimal" value="0"></div>
        <div class="field"><label>单价</label><input id="unitPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="单价"></div>
        <div class="field"><label>金额</label><input id="recordAmount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="自动计算" data-auto="1"></div>
        <div class="field wide"><label>备注</label><textarea id="note" placeholder="库存备注，可留空"></textarea></div>
      </div>
      <datalist id="warehouseList"></datalist>
      <div class="hint" id="timeHint">时间自动生成</div>
      <div class="actions"><button class="btn" id="saveBtn" type="button">保存库存和费用</button><button class="btn secondary" id="newBtn" type="button">新建</button><span class="status" id="saveStatus"></span></div>
      <div class="fee-sections" id="feeSections"></div>
    </section>
    <aside class="panel">
      <div class="panel-head"><h2>SHEIN SKU 缩略图参考</h2><span class="status" id="refStatus"></span></div>
      <div class="ref-tools"><div class="field"><label>搜索参考</label><input id="refSearch" placeholder="仓库 SKU / SHEIN SKU / SKC / 商品名"></div></div>
      <div id="refGrid" class="ref-grid"></div>
    </aside>
  </div>
  <section class="panel">
    <div class="panel-head"><h2>库存列表</h2><div class="toolbar"><input id="search" placeholder="搜索订单号 / 仓库 SKU / 备注"><button class="btn secondary" id="searchBtn" type="button">搜索</button><span class="status" id="tableStatus"></span></div></div>
    <div class="table-wrap"><table id="recordTable"></table></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const num=v=>Number(v||0).toLocaleString(undefined,{maximumFractionDigits:3});const money=(v,c)=>`${c} ${Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;const optional=v=>{const t=String(v??'').trim();return t===''?null:Number(t)};let state={records:[],warehouseRefs:[],feeTypes:{exportAgent:[],oceanImport:[],inbound:[]},current:null};
function toast(msg,bad=false){const el=$('toast');el.textContent=msg;el.className='toast show'+(bad?' bad':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.className='toast',3200)}
function image(url,small=false){return url?`<img class="thumb ${small?'small':''}" src="${esc(url)}" alt="" loading="lazy">`:`<div class="thumb ${small?'small':''} placeholder">SKU</div>`}
function defaultFees(){const out={};for(const group of Object.keys(state.feeTypes)){out[group]=(state.feeTypes[group]||[]).map(item=>({...item,quantity:null,unitPrice:null,amount:null,note:''}))}return out}
function feeRows(group){const existing=state.current?.fees?.[group]||[];const byKey=Object.fromEntries(existing.map(x=>[x.key,x]));return (state.feeTypes[group]||[]).map(item=>({...item,...(byKey[item.key]||{})}))}
function renderCards(s={}){const cards=[['订单号',num(s.orders),'已建立库存订单'],['库存行',num(s.lines),`最多展示 ${num(s.limit||600)} 行`],['仓库 SKU',num(s.warehouseSkus),'涉及仓库 SKU'],['数量合计',num(s.quantity),'库存数量'],['RMB费用',money(s.rmbFees,'RMB'),'出口代理费用'],['USD费用',money(s.usdFees,'USD'),'海运进口 + 入仓']];$('cards').innerHTML=cards.map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${c[2]}</div></div>`).join('')}
function renderWarehouseList(){const options=state.warehouseRefs.map(w=>`<option value="${esc(w.warehouseSku)}">${esc((w.items||[]).slice(0,2).map(i=>i.title||i.sheinSku).filter(Boolean).join(' / '))}</option>`).join('');$('warehouseList').innerHTML=options}
function refText(w){return `${w.warehouseSku} ${(w.items||[]).map(i=>`${i.sheinSku} ${i.title} ${i.skcName} ${i.spuName} ${i.supplierSku} ${i.supplierCode}`).join(' ')}`.toLowerCase()}
function renderRefs(){const selected=$('warehouseSku').value.trim().toLowerCase(),q=$('refSearch').value.trim().toLowerCase();let refs=state.warehouseRefs.filter(w=>(!selected||w.warehouseSku.toLowerCase().includes(selected))&&(!q||refText(w).includes(q)));if(!refs.length&&selected){refs=state.warehouseRefs.filter(w=>refText(w).includes(selected)||(!q||refText(w).includes(q))).slice(0,24)}refs=refs.slice(0,48);const cards=[];refs.forEach(w=>{const items=(w.items||[]).length?w.items:[{sheinSku:'',title:'暂无 SHEIN SKU 映射',imageUrl:'',skcName:'',spuName:''}];items.slice(0,6).forEach(item=>cards.push(`<button class="ref-card" type="button" data-use-wh="${esc(w.warehouseSku)}">${image(item.imageUrl)}<span class="sku">${esc(w.warehouseSku)}</span>${item.sheinSku?`<span class="sub">${esc(item.sheinSku)}</span>`:''}<span class="sub">${esc(item.title||'')}</span>${item.skcName||item.spuName?`<span class="sub">${esc([item.skcName,item.spuName].filter(Boolean).join(' · '))}</span>`:''}</button>`))});$('refStatus').textContent=`${refs.length} 个仓库 SKU`;$('refGrid').innerHTML=cards.length?cards.join(''):'<div class="empty">没有匹配的 SKU 参考</div>';document.querySelectorAll('[data-use-wh]').forEach(btn=>btn.onclick=()=>{$('warehouseSku').value=btn.dataset.useWh;renderRefs()})}
function renderFeeSections(){const exportRows=feeRows('exportAgent'),oceanRows=feeRows('oceanImport'),inboundRows=feeRows('inbound');$('feeSections').innerHTML=`${feeTable('exportAgent','出口代理费用','RMB',exportRows,true)}${feeTable('oceanImport','海运进口费用','USD',oceanRows,true)}${feeTable('inbound','入仓费用','USD',inboundRows,true)}`;bindFeeInputs()}
function feeTable(group,title,currency,rows,hasQty){const head=hasQty?'<tr><th>费用项</th><th class="num">数量</th><th class="num">单价</th><th class="num">金额</th><th>备注</th></tr>':'<tr><th>费用项</th><th class="num">金额</th><th>备注</th></tr>';const body=rows.map(r=>hasQty?`<tr data-fee-group="${group}" data-fee-key="${esc(r.key)}"><td><span class="sku">${esc(r.label)}</span><span class="sub">${currency}</span></td><td class="num"><input class="fee-input" data-field="quantity" type="number" min="0" step="0.001" value="${esc(r.quantity??'')}"></td><td class="num"><input class="fee-input" data-field="unitPrice" type="number" min="0" step="0.01" value="${esc(r.unitPrice??'')}"></td><td class="num"><input class="fee-input" data-field="amount" type="number" min="0" step="0.01" value="${esc(r.amount??'')}" data-auto="${r.amount===null||r.amount===undefined?'1':'0'}"></td><td><input class="fee-note" data-field="note" value="${esc(r.note||'')}"></td></tr>`:`<tr data-fee-group="${group}" data-fee-key="${esc(r.key)}"><td><span class="sku">${esc(r.label)}</span><span class="sub">${currency}</span></td><td class="num"><input class="fee-input" data-field="amount" type="number" min="0" step="0.01" value="${esc(r.amount??'')}"></td><td><input class="fee-note" data-field="note" value="${esc(r.note||'')}"></td></tr>`).join('');return `<section><div class="fee-title"><h3>${title}</h3><span class="badge ${currency==='RMB'?'warn':'blue'}">${currency}</span></div><div class="table-wrap"><table>${head}${body}</table></div></section>`}
function bindFeeInputs(){document.querySelectorAll('tr[data-fee-group] input[data-field="quantity"],tr[data-fee-group] input[data-field="unitPrice"]').forEach(input=>input.addEventListener('input',()=>{const tr=input.closest('tr'),amount=tr.querySelector('[data-field="amount"]');if(amount.dataset.auto==='0'&&amount.value!=='')return;const q=optional(tr.querySelector('[data-field="quantity"]').value),p=optional(tr.querySelector('[data-field="unitPrice"]').value);amount.value=q!==null&&p!==null?(q*p).toFixed(2):'';amount.dataset.auto='1'}));document.querySelectorAll('tr[data-fee-group] input[data-field="amount"]').forEach(input=>input.addEventListener('input',()=>input.dataset.auto='0'))}
function updateRecordAmount(){const amount=$('recordAmount');if(amount.dataset.auto==='0'&&amount.value!=='')return;const q=optional($('quantity').value),p=optional($('unitPrice').value);amount.value=q!==null&&p!==null?(q*p).toFixed(2):'';amount.dataset.auto='1'}
function collectFees(){const out={exportAgent:{},oceanImport:{},inbound:{}};document.querySelectorAll('tr[data-fee-group]').forEach(tr=>{const group=tr.dataset.feeGroup,key=tr.dataset.feeKey,item={};tr.querySelectorAll('[data-field]').forEach(input=>{item[input.dataset.field]=input.value});out[group][key]=item});return out}
function fillForm(record=null){state.current=record;$('orderNo').value=record?.orderNo||'';$('warehouseSku').value=record?.warehouseSku||'';$('quantity').value=record?.quantity??0;$('unitPrice').value=record?.unitPrice??'';$('recordAmount').value=record?.amount??'';$('recordAmount').dataset.auto=record?.amount===null||record?.amount===undefined?'1':'0';$('note').value=record?.note||'';$('editStatus').textContent=record?`编辑 ${record.orderNo} · ${record.warehouseSku}`:'新建记录';$('timeHint').textContent=record?`创建 ${record.createdAt} · 更新 ${record.updatedAt}`:'时间自动生成';renderFeeSections();renderRefs()}
async function saveRecord(){const orderNo=$('orderNo').value.trim(),warehouseSku=$('warehouseSku').value.trim();if(!orderNo){toast('请填写订单号',true);$('orderNo').focus();return}if(!warehouseSku){toast('请填写仓库 SKU',true);$('warehouseSku').focus();return}const payload={id:state.current?.id,orderNo,warehouseSku,quantity:$('quantity').value,unitPrice:$('unitPrice').value,amount:$('recordAmount').value,note:$('note').value,fees:collectFees()};const btn=$('saveBtn');btn.disabled=true;$('saveStatus').textContent='保存中...';try{const r=await fetch('api/inventory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok){toast('保存失败：'+await r.text(),true);return}const data=await r.json();toast('库存和费用已保存');await loadData();const saved=state.records.find(x=>x.id===data.id);fillForm(saved||null)}finally{btn.disabled=false;$('saveStatus').textContent=''}}
function renderTable(){const rows=state.records;$('tableStatus').textContent=`${rows.length} 行`;if(!rows.length){$('recordTable').innerHTML='<tr><td><div class="empty">暂无库存记录</div></td></tr>';return}const head='<tr><th>订单号</th><th>时间</th><th>仓库 SKU</th><th class="num">数量</th><th class="num">单价</th><th class="num">金额</th><th>SHEIN参考</th><th class="num">RMB费用</th><th class="num">USD费用</th><th>备注</th><th>操作</th></tr>';const body=rows.map(r=>{const ref=(r.skuRefs||[])[0]||{};return `<tr class="record-row" data-id="${r.id}"><td><span class="sku">${esc(r.orderNo)}</span></td><td><span class="sub">创建 ${esc(r.createdAt)}</span><span class="sub">更新 ${esc(r.updatedAt)}</span></td><td><span class="sku">${esc(r.warehouseSku)}</span></td><td class="num">${num(r.quantity)}</td><td class="num">${r.unitPrice===null||r.unitPrice===undefined?'-':num(r.unitPrice)}</td><td class="num">${r.amount===null||r.amount===undefined?'-':num(r.amount)}</td><td><div class="record-product">${image(ref.imageUrl,true)}<span class="sub">${esc(ref.sheinSku||ref.title||'-')}</span></div></td><td class="num">${money(r.feeTotals?.rmbTotal,'RMB')}</td><td class="num">${money(r.feeTotals?.usdTotal,'USD')}</td><td><span class="sub">${esc(r.note||'')}</span></td><td><button class="btn secondary" type="button" data-edit="${r.id}">编辑</button></td></tr>`}).join('');$('recordTable').innerHTML=head+body;document.querySelectorAll('[data-edit]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();editRecord(Number(btn.dataset.edit))});document.querySelectorAll('.record-row').forEach(tr=>tr.onclick=()=>editRecord(Number(tr.dataset.id)))}
function editRecord(id){const record=state.records.find(r=>Number(r.id)===id);if(record)fillForm(record);window.scrollTo({top:0,behavior:'smooth'})}
async function loadData(){const qs=new URLSearchParams();if($('search').value.trim())qs.set('q',$('search').value.trim());const r=await fetch('api/inventory?'+qs.toString());if(!r.ok){location.reload();return}const data=await r.json();state={...state,records:data.records||[],warehouseRefs:data.warehouseRefs||[],feeTypes:data.feeTypes||state.feeTypes};$('shop').textContent=`${data.shop} · 库存订单费用`;renderCards(data.summary||{});renderWarehouseList();renderTable();if(state.current){const refreshed=state.records.find(r=>r.id===state.current.id);fillForm(refreshed||state.current)}else{fillForm(null)}}
$('saveBtn').onclick=saveRecord;$('newBtn').onclick=()=>fillForm(null);$('searchBtn').onclick=loadData;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')loadData()});$('warehouseSku').addEventListener('input',renderRefs);$('refSearch').addEventListener('input',renderRefs);$('quantity').addEventListener('input',updateRecordAmount);$('unitPrice').addEventListener('input',updateRecordAmount);$('recordAmount').addEventListener('input',()=>$('recordAmount').dataset.auto='0');loadData();
</script>
</body>
</html>
