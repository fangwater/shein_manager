<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHEIN 退货明细</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>:root{--bg:#eef3f2;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d6dee4;--accent:#0f766e;--accent2:#2563eb;--warn:#b45309;--bad:#b42318;--good:#087443}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{max-width:1640px;margin:0 auto;padding:18px 20px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.brand h1{font-size:25px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;align-items:center}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a.active{color:var(--accent);font-weight:800}.filters{display:grid;grid-template-columns:190px minmax(280px,1fr) 210px 210px auto;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:750;color:#344054;margin-bottom:6px}.field select,.field input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:#fff;color:var(--ink)}.field select[multiple]{height:118px;padding:8px}.actions{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}.actions button{height:40px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;padding:0 18px;cursor:pointer}.actions button:disabled{opacity:.62;cursor:wait}.actions .secondary{background:#fff;color:var(--accent);border:1px solid var(--accent)}.hint{font-size:12px;color:var(--muted);margin-top:6px}.cards{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 14px;min-height:86px}.card .k{font-size:12px;color:var(--muted);font-weight:700}.card .v{font-size:22px;font-weight:850;margin-top:8px}.card .s{font-size:12px;color:var(--muted);margin-top:4px}.card.good .v{color:var(--good)}.card.bad .v{color:var(--bad)}.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px;margin-bottom:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.panel h2{font-size:15px;margin:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.chart{height:320px;width:100%}.tools{display:flex;align-items:center;gap:8px}.tools input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;min-width:300px}.table-wrap{overflow:auto;max-height:680px;border:1px solid var(--line);border-radius:8px;background:#fff}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:right;vertical-align:top}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#f8fafb;color:#344054;z-index:1;cursor:pointer}.text{max-width:280px;white-space:normal;text-align:left}.badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;background:#e7f3f1;color:#0f766e;font-weight:800}.badge.warn{background:#fff1e7;color:#b45309}.status{font-size:12px;color:var(--muted)}td.neg{color:var(--bad);font-weight:750}td.pos{color:var(--good);font-weight:750}@media(max-width:1240px){.cards{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}}@media(max-width:720px){.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.shell{padding:14px 12px 28px}.field select[multiple]{height:140px}.tools{flex-wrap:wrap}.tools input{min-width:0;width:100%}}</style>
</head><body><div class="shell"><div class="top"><div class="brand"><h1>SHEIN 退货明细</h1><p id="shop">加载中...</p></div><div class="nav"><a href="./">PNL</a><a href="logistics">物流分析</a><a href="shipping-fee">Shipping Fee</a><a class="active" href="returns">退货明细</a><a href="sku-mappings">SKU映射</a><a href="warehouse-relations">关联视图</a><a href="inventory">库存管理</a><a href="inventory-templates">成本模板</a><a href="logout">退出</a></div></div><div class="filters"><div class="field"><label>时间字段</label><select id="timeField"></select></div><div class="field"><label>退货状态（可多选）</label><select id="status" multiple></select><div class="hint">不选表示全部状态。</div></div><div class="field"><label>开始时间</label><input id="start" type="datetime-local"></div><div class="field"><label>结束时间</label><input id="end" type="datetime-local"></div><div class="actions"><button id="apply">刷新数据</button><button class="secondary" id="syncLatest" type="button">抓取最新数据</button><div class="hint" id="rangeHint"></div></div></div><div class="cards" id="cards"></div><div class="grid"><div class="panel"><div class="panel-head"><h2>退货趋势</h2><span class="status" id="trendStatus"></span></div><div id="returnTrendChart" class="chart"></div></div><div class="panel"><div class="panel-head"><h2>状态分布</h2></div><div id="statusChart" class="chart"></div></div><div class="panel"><div class="panel-head"><h2>退货成本对比</h2></div><div id="costCompareChart" class="chart"></div></div></div><div class="panel"><div class="panel-head"><h2>退货订单</h2><div class="tools"><input id="search" placeholder="搜索退货单 / 原订单 / SKU / 原因"><span class="status" id="statusText"></span></div></div><div class="table-wrap"><table id="returnsTable"></table></div></div></div>
<script>
const fmtMoney=v=>'$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const fmtNum=v=>Number(v||0).toLocaleString();const val=id=>document.getElementById(id).value;const selected=id=>Array.from(document.getElementById(id).selectedOptions).map(o=>o.value);const escapeHtml=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const cell=(v,cls='')=>`<td class="${cls}">${v??''}</td>`;const textCell=v=>`<td class="text">${escapeHtml(v)}</td>`;const profitClass=v=>Number(v||0)<0?'neg':'pos';let state={rows:[],summary:{},sort:['requestReturnTime',1]};const charts={trend:null,status:null,cost:null};const chartIds={trend:'returnTrendChart',status:'statusChart',cost:'costCompareChart'};function chart(id){if(!charts[id])charts[id]=echarts.init(document.getElementById(chartIds[id]||id));return charts[id]}
async function init(){const f=await fetch('api/returns/filters');if(!f.ok){location.reload();return}const data=await f.json();document.getElementById('shop').textContent=data.shop+' · /shein/shein-us';document.getElementById('timeField').innerHTML=data.timeFields.map(t=>`<option value="${escapeHtml(t.value)}">${escapeHtml(t.label)}</option>`).join('');document.getElementById('status').innerHTML=data.statuses.map(s=>`<option value="${escapeHtml(s.code)}">${escapeHtml(s.label)} · ${s.count}</option>`).join('');document.getElementById('start').value=data.minTime;document.getElementById('end').value=data.maxTime;document.getElementById('rangeHint').textContent=`${data.minTime} 至 ${data.maxTime}`;document.getElementById('apply').onclick=loadData;document.getElementById('syncLatest').onclick=syncLatest;document.getElementById('search').oninput=()=>renderTable(state.rows);await loadData()}
async function loadData(){const qs=new URLSearchParams();selected('status').forEach(s=>qs.append('status',s));if(val('start'))qs.set('start',val('start'));if(val('end'))qs.set('end',val('end'));if(val('timeField'))qs.set('timeField',val('timeField'));const r=await fetch('api/returns/data?'+qs.toString());if(!r.ok){alert('加载失败：'+await r.text());return}const data=await r.json();state={...state,rows:data.rows,summary:data.summary};renderCards(data.summary);renderCharts(data.rows,data.summary);renderTable(data.rows)}
async function syncLatest(){const btn=document.getElementById('syncLatest'),apply=document.getElementById('apply'),old=btn.textContent;btn.disabled=true;apply.disabled=true;btn.textContent='抓取中...';document.getElementById('rangeHint').textContent='正在从 SHEIN 抓取最新售后单并重建利润数据...';try{const r=await fetch('api/returns/sync-latest',{method:'POST'});if(!r.ok)throw new Error(await r.text());const data=await r.json(),info=data.sync?.returns||{},exported=data.export||{};document.getElementById('rangeHint').textContent=`抓取完成：售后 ${fmtNum(info.listReturnsSeen||0)} 单，利润表 ${fmtNum(exported.item_rows||0)} 行，正在刷新页面...`;setTimeout(()=>location.reload(),500)}catch(err){alert('抓取最新售后数据失败：'+err.message);document.getElementById('rangeHint').textContent='抓取失败';btn.disabled=false;apply.disabled=false;btn.textContent=old}}
function renderCards(s){const cards=[['退货单',fmtNum(s.returnOrders),`关联订单 ${fmtNum(s.linkedOrders)}`],['商品行',fmtNum(s.goodsLines),'退货商品明细行'],['PNL成本',fmtMoney(s.pnlInternalCost),'成本仍计入'],['PNL利润',fmtMoney(s.pnlProfit),'退货利润归零',s.pnlProfit<0?'bad':'good'],['原始收入',fmtMoney(s.originalGrossRevenue),'归零前口径'],['原始利润',fmtMoney(s.originalProfit),'归零前利润',s.originalProfit<0?'bad':'good'],['平台履约费',fmtMoney(s.performanceCost),'退货单字段'],['上限',fmtNum(s.limit),'最多展示行数']];document.getElementById('cards').innerHTML=cards.map(c=>`<div class="card ${c[3]||''}"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${c[2]}</div></div>`).join('')}
function dayOf(v){return String(v||'').slice(0,10)||'未知'}function group(rows,keyFn,valFn=()=>1){const m=new Map();rows.forEach(r=>{const k=keyFn(r);m.set(k,(m.get(k)||0)+valFn(r))});return [...m.entries()].map(([name,value])=>({name,value}))}
function renderCharts(rows,s){document.getElementById('trendStatus').textContent=`按 ${s.timeFieldLabel} 筛选`;const trend=group(rows,r=>dayOf(r.requestReturnTime)).sort((a,b)=>a.name.localeCompare(b.name));chart('trend').setOption({color:['#0f766e','#2563eb'],tooltip:{trigger:'axis'},grid:{left:44,right:20,top:24,bottom:42},xAxis:{type:'category',data:trend.map(x=>x.name.slice(5)),axisLabel:{color:'#667085'}},yAxis:{type:'value'},dataZoom:[{type:'inside'}],series:[{name:'退货单',type:'bar',data:trend.map(x=>x.value)},{name:'PNL成本',type:'line',smooth:true,yAxisIndex:0,data:trend.map(x=>rows.filter(r=>dayOf(r.requestReturnTime)===x.name).reduce((a,r)=>a+Number(r.pnlInternalCost||0),0))}]});const statuses=group(rows,r=>r.returnStatusLabel||r.returnStatus||'未知');chart('status').setOption({color:['#0f766e','#2563eb','#b45309','#7c3aed','#b42318'],tooltip:{trigger:'item',formatter:p=>`${p.name}<br>${fmtNum(p.value)} (${p.percent}%)`},legend:{bottom:0},series:[{type:'pie',radius:['46%','72%'],center:['50%','43%'],label:{formatter:'{b}\n{d}%'},data:statuses}]});chart('cost').setOption({color:['#0f766e','#2563eb','#b45309','#7c3aed'],tooltip:{trigger:'axis',axisPointer:{type:'shadow'},valueFormatter:fmtMoney},grid:{left:76,right:18,top:22,bottom:34},xAxis:{type:'value',axisLabel:{formatter:v=>'$'+v}},yAxis:{type:'category',data:['PNL成本','PNL利润','原始收入','原始利润']},series:[{type:'bar',data:[s.pnlInternalCost||0,s.pnlProfit||0,s.originalGrossRevenue||0,s.originalProfit||0],itemStyle:{color:p=>p.value<0?'#b42318':['#0f766e','#2563eb','#b45309','#7c3aed'][p.dataIndex]}}]})}
function sortRows(rows,key){const current=state.sort||[key,1];const dir=current[0]===key?-current[1]:-1;state.sort=[key,dir];return [...rows].sort((a,b)=>{const av=a[key]??'',bv=b[key]??'';if(typeof av==='number'||typeof bv==='number')return (Number(av)>Number(bv)?1:-1)*dir;return String(av).localeCompare(String(bv))*dir})}
function renderTable(rows){const q=document.getElementById('search').value.toLowerCase();let filtered=rows.filter(r=>(`${r.returnNo} ${r.orderNo} ${r.skus} ${r.goodsTitles} ${r.reasons}`).toLowerCase().includes(q));const [key,dir]=state.sort;filtered=[...filtered].sort((a,b)=>String(a[key]??'').localeCompare(String(b[key]??''))*dir);document.getElementById('statusText').textContent=`${filtered.length} 条 · 按 ${state.summary.timeFieldLabel} 筛选`;const head='<tr><th data-k="returnNo">退货单号</th><th data-k="orderNo">原订单</th><th data-k="returnStatusLabel">退货状态</th><th>原订单状态</th><th data-k="requestReturnTime">申请时间</th><th data-k="lastUpdateTime">更新时间</th><th>完成时间</th><th>站点</th><th>类型</th><th data-k="goodsLines">商品行</th><th>SKU</th><th>商品</th><th>原因</th><th>物流商</th><th>平台运单</th><th>买家运单</th><th data-k="performanceCost">平台履约费</th><th data-k="pnlInternalCost">PNL成本</th><th data-k="pnlProfit">PNL利润</th><th data-k="originalGrossRevenue">原始收入</th><th data-k="originalProfit">原始利润</th></tr>';const body=filtered.map(r=>`<tr>${cell(escapeHtml(r.returnNo))}${cell(escapeHtml(r.orderNo))}${cell(`<span class="badge warn">${escapeHtml(r.returnStatusLabel||r.returnStatus)}</span>`)}${cell(escapeHtml(r.orderStatusLabel))}${cell(escapeHtml(r.requestReturnTime))}${cell(escapeHtml(r.lastUpdateTime))}${cell(escapeHtml(r.completedTime))}${cell(escapeHtml(r.site))}${cell(escapeHtml(r.noReturnGoodsLabel))}${cell(fmtNum(r.goodsLines))}${textCell(r.skus)}${textCell(r.goodsTitles)}${textCell(r.reasons)}${cell(escapeHtml(r.expressCompanyName))}${cell(escapeHtml(r.platformExpressNo))}${cell(escapeHtml(r.memberExpressNo))}${cell(fmtMoney(r.performanceCost))}${cell(fmtMoney(r.pnlInternalCost))}${cell(fmtMoney(r.pnlProfit),profitClass(r.pnlProfit))}${cell(fmtMoney(r.originalGrossRevenue))}${cell(fmtMoney(r.originalProfit),profitClass(r.originalProfit))}</tr>`).join('');document.getElementById('returnsTable').innerHTML=head+body;document.querySelectorAll('#returnsTable th[data-k]').forEach(th=>th.onclick=()=>{state.rows=sortRows(state.rows,th.dataset.k);renderTable(state.rows)})}
window.addEventListener('resize',()=>Object.values(charts).forEach(c=>c&&c.resize()));init();
</script></body></html>
